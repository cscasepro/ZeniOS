<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pliki</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h1 { font-size: 20px; }
        .btns {
            display: flex;
            gap: 8px;
        }
        button {
            flex: 1;
            padding: 10px 12px;
            border-radius: 12px;
            border: none;
            background: #38bdf8;
            color: #090d16;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        button.sec {
            background: rgba(255, 255, 255, 0.12);
            color: #f8fafc;
        }
        textarea {
            width: 100%;
            min-height: 150px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: #030712;
            color: #cbd5e1;
            padding: 10px;
            font-family: ui-monospace, monospace;
            font-size: 11px;
        }
        .keys {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .key-row {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 9px 12px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }
        .msg {
            font-size: 12px;
            color: #86efac;
            min-height: 16px;
        }
    </style>
</head>
<body>
    <h1>Pliki i pamięć</h1>
    <div class="btns">
        <button onclick="exportData()">Eksportuj JSON</button>
        <button class="sec" onclick="importData()">Importuj JSON</button>
    </div>
    <textarea id="dump" placeholder="Tutaj pojawi się eksport danych lub wklej kopię JSON do importu..."></textarea>
    <div id="msg" class="msg"></div>
    <div id="keys" class="keys"></div>

    <script>
        function refreshKeys() {
            const p = window.parent;
            const list = (p && p.StorageManager && p.StorageManager.listKeys()) || [];
            const box = document.getElementById('keys');
            box.innerHTML = '';
            if (!list.length) {
                box.innerHTML = '<div class="key-row"><span>Brak zapisanych kluczy</span><span>0</span></div>';
                return;
            }
            list.forEach(k => {
                const row = document.createElement('div');
                row.className = 'key-row';
                row.innerHTML = `<span>${k}</span><span>OK</span>`;
                box.appendChild(row);
            });
        }

        function exportData() {
            const p = window.parent;
            if (!p || !p.StorageManager) return;
            document.getElementById('dump').value = p.StorageManager.exportAll();
            document.getElementById('msg').textContent = 'Wyeksportowano dane systemu.';
        }

        function importData() {
            const p = window.parent;
            if (!p || !p.StorageManager) return;
            try {
                p.StorageManager.importAll(document.getElementById('dump').value);
                document.getElementById('msg').textContent = 'Zaimportowano kopię danych.';
                refreshKeys();
            } catch (err) {
                document.getElementById('msg').textContent = 'Błąd importu: ' + err.message;
            }
        }

        refreshKeys();
    </script>
</body>
</html>
