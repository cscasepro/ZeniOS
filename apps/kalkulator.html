<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalkulator — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            height: 100vh;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px 18px 66px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.14);
            border: none;
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .display {
            margin-top: auto;
            text-align: right;
            font-size: clamp(54px, 16vw, 82px);
            font-weight: 300;
            padding: 12px 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }
        button.key {
            aspect-ratio: 1;
            border-radius: 50%;
            border: none;
            font-size: 28px;
            font-weight: 500;
            cursor: pointer;
            transition: filter 0.12s ease, transform 0.12s ease;
        }
        button.key:active {
            filter: brightness(1.3);
            transform: scale(0.95);
        }
        .fn { background: #a5a5a5; color: #000000; }
        .num { background: #333333; color: #ffffff; }
        .op { background: #ff9f0a; color: #ffffff; }
        .zero {
            grid-column: span 2;
            aspect-ratio: auto;
            border-radius: 999px;
            text-align: left;
            padding-left: 28px;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <button class="back-btn" onclick="parent.Kernel?.goHome()">‹ Pulpit</button>
    </div>

    <div id="disp" class="display">0</div>

    <div class="keys">
        <button class="key fn" onclick="clearAll()">AC</button>
        <button class="key fn" onclick="toggleSign()">+/-</button>
        <button class="key fn" onclick="percent()">%</button>
        <button class="key op" onclick="setOp('/')">÷</button>

        <button class="key num" onclick="digit('7')">7</button>
        <button class="key num" onclick="digit('8')">8</button>
        <button class="key num" onclick="digit('9')">9</button>
        <button class="key op" onclick="setOp('*')">×</button>

        <button class="key num" onclick="digit('4')">4</button>
        <button class="key num" onclick="digit('5')">5</button>
        <button class="key num" onclick="digit('6')">6</button>
        <button class="key op" onclick="setOp('-')">−</button>

        <button class="key num" onclick="digit('1')">1</button>
        <button class="key num" onclick="digit('2')">2</button>
        <button class="key num" onclick="digit('3')">3</button>
        <button class="key op" onclick="setOp('+')">+</button>

        <button class="key num zero" onclick="digit('0')">0</button>
        <button class="key num" onclick="dot()">.</button>
        <button class="key op" onclick="equals()">=</button>
    </div>

    <script>
        let cur = '0';
        let prev = null;
        let op = null;
        let resetNext = false;

        function update() {
            document.getElementById('disp').textContent = cur;
        }

        function digit(d) {
            if (resetNext) {
                cur = d;
                resetNext = false;
            } else {
                cur = cur === '0' ? d : cur + d;
            }
            update();
        }

        function dot() {
            if (resetNext) {
                cur = '0.';
                resetNext = false;
            } else if (!cur.includes('.')) {
                cur += '.';
            }
            update();
        }

        function clearAll() {
            cur = '0';
            prev = null;
            op = null;
            resetNext = false;
            update();
        }

        function toggleSign() {
            cur = String(Number(cur) * -1);
            update();
        }

        function percent() {
            cur = String(Number(cur) / 100);
            update();
        }

        function setOp(nextOp) {
            if (op && !resetNext) equals();
            prev = Number(cur);
            op = nextOp;
            resetNext = true;
        }

        function equals() {
            if (op === null || prev === null) return;
            const b = Number(cur);
            let res = b;
            if (op === '+') res = prev + b;
            if (op === '-') res = prev - b;
            if (op === '*') res = prev * b;
            if (op === '/') res = b === 0 ? 'Błąd' : prev / b;
            cur = typeof res === 'number' ? String(Number(res.toFixed(8))) : res;
            op = null;
            prev = null;
            resetNext = true;
            update();
        }
    </script>
</body>
</html>
