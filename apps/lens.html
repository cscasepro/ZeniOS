<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            min-height: 100vh;
            background: linear-gradient(155deg, #1e293b 0%, #0f172a 55%, #060911 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 54px 18px 28px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 3;
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(16px);
            color: #ffffff;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .result-card {
            margin-top: 14px;
            border-radius: 24px;
            padding: 15px 17px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.34);
            backdrop-filter: blur(22px);
            box-shadow: 0 14px 32px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .result-tag {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #93c5fd;
        }
        .result-text {
            font-size: 14px;
            line-height: 1.4;
        }
        .scan-reticle {
            margin: auto;
            width: 220px;
            height: 220px;
            border-radius: 34px;
            border: 2px solid rgba(255, 255, 255, 0.45);
            box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.24);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
        }
        .bottom-controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 3;
        }
        .mode-pills {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        .mode-pill {
            padding: 7px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .mode-pill.active {
            background: #ffffff;
            color: #090d16;
        }
        .prompt-bar {
            display: flex;
            gap: 8px;
            align-items: center;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.32);
            backdrop-filter: blur(20px);
            border-radius: 999px;
            padding: 6px 8px 6px 14px;
        }
        .prompt-bar input {
            flex: 1;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 13.5px;
            outline: none;
        }
        .prompt-bar input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }
    </style>
</head>
<body>
    <div>
        <div class="topbar">
            <button class="glass-btn" onclick="parent.Kernel?.goHome()">‹ Pulpit</button>
            <span style="font-weight:700;font-size:16px;">QR</span>
            <button class="glass-btn" onclick="cycleSample()">Skanuj</button>
        </div>

        <div class="result-card">
            <span id="res-tag" class="result-tag">Kod QR / Obiekt</span>
            <p id="res-text" class="result-text">Skieruj kadr na kod QR, tekst lub obiekt albo wpisz zapytanie poniżej.</p>
        </div>
    </div>

    <div class="scan-reticle" onclick="cycleSample()">
        <span style="font-size:34px;">⌖</span>
        <span style="font-size:12px;opacity:0.85;">Dotknij, aby rozpoznać kadr</span>
    </div>

    <div class="bottom-controls">
        <div class="mode-pills">
            <button class="mode-pill active" onclick="setMode(this, 'QR')">Kod QR</button>
            <button class="mode-pill" onclick="setMode(this, 'Tekst')">Tekst</button>
            <button class="mode-pill" onclick="setMode(this, 'Obiekt')">Obiekt</button>
        </div>

        <div class="prompt-bar">
            <input id="query-input" type="text" placeholder="Zapytaj o zeskanowany kod lub obiekt..." onkeydown="if(event.key==='Enter') askQuery()">
            <button class="glass-btn" onclick="askQuery()">Wyślij</button>
        </div>
    </div>

    <script>
        const samples = [
            { tag: 'Kod QR • Link', text: 'https://zenos.local/connect — szybkie parowanie urządzenia ZenOS.' },
            { tag: 'Tekst OCR', text: 'Wykryto tekst w kadrze: „ZenOS Liquid Glass — tryb gotowości”.' },
            { tag: 'Rozpoznany obiekt', text: 'Wykryto roślinę doniczkową oraz jasne otoczenie biurkowe.' }
        ];
        let idx = 0;
        let currentMode = 'QR';

        function setMode(el, mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-pill').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('res-tag').textContent = `Tryb: ${mode}`;
        }

        function cycleSample() {
            const item = samples[idx % samples.length];
            idx++;
            document.getElementById('res-tag').textContent = item.tag;
            document.getElementById('res-text').textContent = item.text;
        }

        function askQuery() {
            const inp = document.getElementById('query-input');
            const val = inp.value.trim();
            if (!val) return;
            document.getElementById('res-tag').textContent = `${currentMode} • Odpowiedź`;
            document.getElementById('res-text').textContent = `Analiza „${val}” w trybie ${currentMode} zakończona.`;
            inp.value = '';
        }
    </script>
</body>
</html>
