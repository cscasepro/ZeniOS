<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lens</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        h1 { font-size: 20px; }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        img {
            width: 100%;
            max-height: 170px;
            object-fit: cover;
            border-radius: 12px;
            display: none;
        }
        button {
            padding: 10px 14px;
            border-radius: 12px;
            border: none;
            background: #38bdf8;
            color: #090d16;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .info {
            font-size: 12px;
            color: #cbd5e1;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <h1>Lens • Analiza obrazu</h1>
    <div class="card">
        <button onclick="analyzeLatest()">Analizuj ostatnie zdjęcie z Galerii</button>
        <input type="file" accept="image/*" style="font-size:11px;color:#94a3b8;" onchange="analyzeFile(this)">
        <img id="target" alt="Podgląd analizy">
        <div id="result" class="info">Wybierz zdjęcie lub wczytaj plik, aby sprawdzić dominującą tonację i jasność.</div>
    </div>

    <script>
        function analyzeDataUrl(dataUrl) {
            const img = document.getElementById('target');
            img.src = dataUrl;
            img.style.display = 'block';

            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = 64;
                c.height = 64;
                const ctx = c.getContext('2d');
                ctx.drawImage(img, 0, 0, 64, 64);
                const d = ctx.getImageData(0, 0, 64, 64).data;

                let r = 0, g = 0, b = 0;
                const px = d.length / 4;
                for (let i = 0; i < d.length; i += 4) {
                    r += d[i];
                    g += d[i + 1];
                    b += d[i + 2];
                }
                r = Math.round(r / px);
                g = Math.round(g / px);
                b = Math.round(b / px);
                const lum = Math.round(0.299 * r + 0.587 * g + 0.114 * b);
                const tone = lum > 155 ? 'Jasna scena' : lum > 75 ? 'Zrównoważona ekspozycja' : 'Ciemna scena / noc';

                document.getElementById('result').textContent =
                    `Wynik: ${tone} (jasność ${lum}/255, średni RGB: ${r}, ${g}, ${b}).`;
            };
        }

        function analyzeLatest() {
            const p = window.parent;
            const photos = (p && p.StorageManager && p.StorageManager.get('gallery_photos', [])) || [];
            if (!photos.length) {
                document.getElementById('result').textContent = 'Brak zdjęć w Galerii.';
                return;
            }
            analyzeDataUrl(photos[0].dataUrl);
        }

        function analyzeFile(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => analyzeDataUrl(reader.result);
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
