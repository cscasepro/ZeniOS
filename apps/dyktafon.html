<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dyktafon — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            min-height: 100vh;
            background: #f8f8fa;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            padding: 48px 18px 72px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 16px;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .link-btn {
            background: none;
            border: none;
            color: #ff3b30;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        .rec-card {
            background: #ffffff;
            border-radius: 26px;
            padding: 18px;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .wave-box {
            width: 100%;
            height: 120px;
            border-radius: 16px;
            background: #f2f2f7;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            padding: 0 12px;
            overflow: hidden;
        }
        .wave-bar {
            width: 3px;
            height: 18%;
            border-radius: 999px;
            background: #ef4444;
            transition: height 0.14s ease;
        }
        .playhead {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: #ff3b30;
        }
        .clock-readout {
            font-size: 36px;
            font-weight: 400;
            font-variant-numeric: tabular-nums;
        }
        .controls-row {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
        }
        .rec-outer {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            border: 3px solid #d1d5db;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .rec-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ff3b30;
            transition: border-radius 0.2s ease, transform 0.2s ease;
        }
        .rec-outer.recording .rec-inner {
            border-radius: 8px;
            transform: scale(0.55);
        }
        .saved-list {
            background: #ffffff;
            border-radius: 22px;
            padding: 12px 16px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
        }
        .saved-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f2f2f7;
            font-size: 14px;
        }
        .saved-item:last-child { border-bottom: none; }
    </style>
</head>
<body>
    <div class="topbar">
        <button class="link-btn" onclick="parent.Kernel?.goHome()">‹ Pulpit</button>
        <strong style="font-size:17px;">Dyktafon</strong>
        <span style="width:52px;"></span>
    </div>

    <div class="rec-card">
        <div style="text-align:center;">
            <div style="font-size:17px;font-weight:700;">Nowe nagranie</div>
            <div style="font-size:12.5px;color:#6b7280;">ZenOS • Mikrofon wbudowany</div>
        </div>

        <div id="wave" class="wave-box">
            <div class="playhead"></div>
        </div>

        <div id="readout" class="clock-readout">00:00.00</div>

        <div class="controls-row">
            <div></div>
            <div id="rec-btn" class="rec-outer" onclick="toggleRec()">
                <div class="rec-inner"></div>
            </div>
            <button class="link-btn" style="justify-self:end;" onclick="saveRecording()">Zachowaj</button>
        </div>
    </div>

    <div class="saved-list">
        <div style="font-size:13px;font-weight:700;color:#6b7280;margin-bottom:6px;">Zapisane nagrania</div>
        <div id="recordings">
            <div class="saved-item">
                <div><strong>Notatka głosowa 1</strong><div style="font-size:12px;color:#6b7280;">Dzisiaj • 00:23</div></div>
                <span style="color:#ff3b30;font-weight:600;font-size:13px;">00:23</span>
            </div>
        </div>
    </div>

    <script>
        const wave = document.getElementById('wave');
        const bars = [];
        for (let i = 0; i < 42; i++) {
            const b = document.createElement('div');
            b.className = 'wave-bar';
            wave.appendChild(b);
            bars.push(b);
        }

        let isRec = false, elapsed = 0, startTs = 0, loop = null;

        function fmt(ms) {
            const m = String(Math.floor(ms / 60000)).padStart(2, '0');
            const s = String(Math.floor((ms % 60000) / 1000)).padStart(2, '0');
            const cs = String(Math.floor((ms % 1000) / 10)).padStart(2, '0');
            return `${m}:${s}.${cs}`;
        }

        function toggleRec() {
            const btn = document.getElementById('rec-btn');
            if (!isRec) {
                isRec = true;
                btn.classList.add('recording');
                startTs = performance.now() - elapsed;
                loop = setInterval(() => {
                    elapsed = performance.now() - startTs;
                    document.getElementById('readout').textContent = fmt(elapsed);
                    bars.forEach(b => {
                        b.style.height = `${14 + Math.random() * 76}%`;
                    });
                }, 110);
            } else {
                isRec = false;
                btn.classList.remove('recording');
                clearInterval(loop);
                bars.forEach(b => { b.style.height = '18%'; });
            }
        }

        function saveRecording() {
            const dur = document.getElementById('readout').textContent.slice(0, 5);
            const list = document.getElementById('recordings');
            const row = document.createElement('div');
            row.className = 'saved-item';
            row.innerHTML = `<div><strong>Nagranie #${list.children.length + 1}</strong><div style="font-size:12px;color:#6b7280;">Właśnie teraz • ${dur}</div></div><span style="color:#ff3b30;font-weight:600;font-size:13px;">${dur}</span>`;
            list.prepend(row);
            elapsed = 0;
            document.getElementById('readout').textContent = '00:00.00';
        }
    </script>
</body>
</html>
