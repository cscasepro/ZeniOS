  <!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dyktafon</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        h1 { font-size: 20px; }
        .rec-box {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 18px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        button {
            padding: 11px 18px;
            border-radius: 999px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-rec { background: #ef4444; color: #ffffff; }
        .btn-stop { background: #38bdf8; color: #090d16; }
        .status { font-size: 12px; color: #cbd5e1; }
        .list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        audio { width: 100%; height: 32px; }
    </style>
</head>
<body>
    <h1>Dyktafon</h1>
    <div class="rec-box">
        <div id="rec-status" class="status">Gotowy do nagrywania</div>
        <div style="display:flex;gap:8px;">
            <button id="btn-start" class="btn-rec" onclick="startRec()">● Nagrywaj</button>
            <button id="btn-stop" class="btn-stop" onclick="stopRec()" disabled>■ Stop</button>
        </div>
    </div>
    <div id="list" class="list"></div>

    <script>
        let recorder = null;
        let chunks = [];
        const recordings = [];

        async function startRec() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                chunks = [];
                recorder = new MediaRecorder(stream);
                recorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) chunks.push(e.data);
                };
                recorder.onstop = () => {
                    stream.getTracks().forEach(t => t.stop());
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const url = URL.createObjectURL(blob);
                    recordings.unshift({
                        name: `Nagranie ${recordings.length + 1} (${new Date().toTimeString().slice(0, 5)})`,
                        url
                    });
                    renderList();
                };
                recorder.start();
                document.getElementById('btn-start').disabled = true;
                document.getElementById('btn-stop').disabled = false;
                document.getElementById('rec-status').textContent = 'Nagrywanie w toku...';
            } catch (_) {
                document.getElementById('rec-status').textContent = 'Brak dostępu do mikrofonu w tej przeglądarce.';
            }
        }

        function stopRec() {
            if (recorder && recorder.state !== 'inactive') {
                recorder.stop();
            }
            document.getElementById('btn-start').disabled = false;
            document.getElementById('btn-stop').disabled = true;
            document.getElementById('rec-status').textContent = 'Zapisano nagranie.';
        }

        function renderList() {
            const box = document.getElementById('list');
            box.innerHTML = '';
            recordings.forEach(r => {
                const div = document.createElement('div');
                div.className = 'item';
                div.innerHTML = `<div style="font-size:12px;font-weight:700;">${r.name}</div><audio controls src="${r.url}"></audio>`;
                box.appendChild(div);
            });
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'OS_PRIORITY' && e.data.level === 'BACKGROUND') {
                if (recorder && recorder.state === 'recording') stopRec();
            }
        });
    </script>
</body>
  </html>
