<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aparat — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            height: 100vh;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .top-controls {
            padding: 50px 18px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
        }
        .pill {
            background: rgba(24, 24, 28, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(18px);
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .viewfinder {
            position: relative;
            flex: 1;
            margin: 4px 10px;
            border-radius: 28px;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #232734 0%, #0d1017 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform-origin: center;
            transition: transform 0.25s ease;
        }
        .grid-lines {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.18) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.18) 1px, transparent 1px);
            background-size: 33.33% 33.33%;
        }
        .crosshair {
            position: absolute;
            width: 24px;
            height: 24px;
            pointer-events: none;
        }
        .crosshair::before, .crosshair::after {
            content: "";
            position: absolute;
            background: #ffd60a;
        }
        .crosshair::before { left: 11px; top: 0; width: 1.5px; height: 24px; }
        .crosshair::after { top: 11px; left: 0; height: 1.5px; width: 24px; }
        .zoom-bar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            padding: 5px 8px;
            border-radius: 999px;
            background: rgba(15, 16, 20, 0.65);
            backdrop-filter: blur(16px);
        }
        .zoom-btn {
            min-width: 34px;
            height: 34px;
            border-radius: 50%;
            border: none;
            background: transparent;
            color: #ffffff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .zoom-btn.active {
            background: rgba(255, 255, 255, 0.16);
            color: #ffd60a;
        }
        .bottom-deck {
            padding: 12px 22px 58px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .modes {
            display: flex;
            gap: 18px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.6px;
        }
        .mode-item {
            padding: 5px 12px;
            border-radius: 999px;
            color: rgba(255, 255, 255, 0.72);
            cursor: pointer;
        }
        .mode-item.active {
            background: rgba(255, 255, 255, 0.14);
            color: #ffd60a;
        }
        .shutter-row {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .thumb-btn {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: #1c1c1e;
            overflow: hidden;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .thumb-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .shutter-ring {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .shutter-core {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #ffffff;
            transition: transform 0.15s ease, background 0.2s ease, border-radius 0.2s ease;
        }
        .shutter-ring.video .shutter-core {
            background: #ff3b30;
        }
        .shutter-ring.recording .shutter-core {
            transform: scale(0.54);
            border-radius: 10px;
        }
        .flip-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top-controls">
        <button class="pill" onclick="parent.Kernel?.goHome()">‹ Pulpit</button>
        <button id="flash-pill" class="pill" onclick="toggleFlash()">⚡ Auto</button>
        <span id="rec-timer" style="font-size:12px;font-weight:700;color:#ff453a;min-width:44px;text-align:right;"></span>
    </div>

    <div class="viewfinder">
        <video id="cam-video" autoplay playsinline muted></video>
        <div class="grid-lines"></div>
        <div class="crosshair"></div>
        <div id="zoom-bar" class="zoom-bar"></div>
    </div>

    <div class="bottom-deck">
        <div class="modes">
            <span class="mode-item" onclick="setMode('WIDEO', this)">WIDEO</span>
            <span class="mode-item active" onclick="setMode('ZDJĘCIE', this)">ZDJĘCIE</span>
            <span class="mode-item" onclick="setMode('PORTRET', this)">PORTRET</span>
        </div>

        <div class="shutter-row">
            <button id="last-thumb" class="thumb-btn" onclick="parent.Kernel?.openApp('galeria')" title="Galeria">🖼️</button>
            <div id="shutter" class="shutter-ring" onclick="triggerShutter()">
                <div class="shutter-core"></div>
            </div>
            <button class="flip-btn" onclick="flipCamera()" title="Przełącz aparat">🔄</button>
        </div>
    </div>

    <canvas id="snap-canvas" style="display:none;"></canvas>

    <script>
        let currentMode = 'ZDJĘCIE';
        let currentZoom = 1;
        let facingMode = 'environment';
        let stream = null;
        let recording = false;
        let recSeconds = 0;
        let recInterval = null;
        let hasUltraWide = false;

        async function initCamera() {
            if (stream) stream.getTracks().forEach(t => t.stop());
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: false });
                const video = document.getElementById('cam-video');
                video.srcObject = stream;
                const track = stream.getVideoTracks()[0];
                const caps = track?.getCapabilities ? track.getCapabilities() : {};
                hasUltraWide = Boolean(caps.zoom && typeof caps.zoom.min === 'number' && caps.zoom.min <= 0.6);
            } catch {
                hasUltraWide = false;
            }
            renderZoomButtons();
            loadLastThumb();
        }

        function renderZoomButtons() {
            const bar = document.getElementById('zoom-bar');
            const levels = hasUltraWide ? [0.5, 1, 2] : [1, 2];
            if (!levels.includes(currentZoom)) currentZoom = 1;
            bar.innerHTML = levels.map(z => `
                <button class="zoom-btn ${currentZoom === z ? 'active' : ''}" onclick="setZoom(${z})">${z === 0.5 ? '0,5' : z + 'x'}</button>
            `).join('');
        }

        function setZoom(z) {
            currentZoom = z;
            const scale = z < 1 ? 1 : z;
            document.getElementById('cam-video').style.transform = `scale(${scale})`;
            renderZoomButtons();
        }

        function setMode(mode, el) {
            currentMode = mode;
            document.querySelectorAll('.mode-item').forEach(m => m.classList.remove('active'));
            el.classList.add('active');
            const ring = document.getElementById('shutter');
            ring.classList.toggle('video', mode === 'WIDEO');
        }

        function toggleFlash() {
            const btn = document.getElementById('flash-pill');
            btn.textContent = btn.textContent.includes('Auto') ? '⚡ Wł.' : '⚡ Auto';
        }

        function flipCamera() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            initCamera();
        }

        function loadLastThumb() {
            const list = parent.StorageManager?.get('gallery_photos', []) || [];
            if (list.length) {
                document.getElementById('last-thumb').innerHTML = `<img src="${list[0].dataUrl}" alt="Ostatnie">`;
            }
        }

        function triggerShutter() {
            if (currentMode === 'WIDEO') {
                recording = !recording;
                const ring = document.getElementById('shutter');
                const timerEl = document.getElementById('rec-timer');
                ring.classList.toggle('recording', recording);
                if (recording) {
                    recSeconds = 0;
                    timerEl.textContent = '00:00';
                    recInterval = setInterval(() => {
                        recSeconds++;
                        const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
                        const s = String(recSeconds % 60).padStart(2, '0');
                        timerEl.textContent = `${m}:${s}`;
                    }, 1000);
                } else {
                    clearInterval(recInterval);
                    timerEl.textContent = '';
                }
                return;
            }

            const video = document.getElementById('cam-video');
            const canvas = document.getElementById('snap-canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 800;
            const ctx = canvas.getContext('2d');
            if (video.videoWidth) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            } else {
                const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                grad.addColorStop(0, '#2563eb');
                grad.addColorStop(1, '#0f172a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            const existing = parent.StorageManager?.get('gallery_photos', []) || [];
            existing.unshift({ id: Date.now(), title: `Zdjęcie ${new Date().toLocaleTimeString('pl-PL')}`, album: 'Ostatnie', dataUrl });
            parent.StorageManager?.set('gallery_photos', existing.slice(0, 30));
            loadLastThumb();
        }

        initCamera();
    </script>
</body>
</html>
