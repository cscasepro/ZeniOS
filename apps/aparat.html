<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aparat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            height: 100vh;
            background: #030712;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 12px 14px 16px;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .mode-switch {
            display: flex;
            background: rgba(30, 41, 59, 0.9);
            border-radius: 999px;
            padding: 3px;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }
        .mode-btn {
            padding: 5px 12px;
            border-radius: 999px;
            border: none;
            background: transparent;
            color: #cbd5e1;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }
        .mode-btn.active {
            background: #38bdf8;
            color: #090d16;
        }
        .small-btn {
            padding: 6px 10px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(15, 23, 42, 0.85);
            color: #f8fafc;
            font-size: 11px;
            cursor: pointer;
        }
        .viewfinder {
            position: relative;
            flex: 1;
            margin: 10px 0;
            border-radius: 22px;
            overflow: hidden;
            background: #090d16;
            border: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        video, canvas#preview-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .standby {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            padding: 16px;
        }
        .bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .shutter {
            width: 64px;
            height: 64px;
            border-radius: 999px;
            border: 4px solid #ffffff;
            background: rgba(255, 255, 255, 0.25);
            cursor: pointer;
        }
        .shutter:active { transform: scale(0.93); }
        .msg {
            font-size: 11px;
            color: #86efac;
            text-align: center;
            min-height: 14px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="mode-switch">
            <button id="btn-hdr" class="mode-btn active" onclick="setMode('HDR')">iPhone HDR</button>
            <button id="btn-raw" class="mode-btn" onclick="setMode('RAW')">RAW</button>
        </div>
        <button class="small-btn" onclick="switchCam()">🔄 Kamera</button>
    </div>

    <div class="viewfinder">
        <video id="video" autoplay playsinline muted style="display:none;"></video>
        <canvas id="preview-canvas" style="display:none;"></canvas>
        <div id="standby" class="standby">Włączam aparat... Jeśli przeglądarka poprosi o dostęp do kamery, zezwól lub użyj trybu testowego.</div>
    </div>

    <div id="msg" class="msg"></div>

    <div class="bottom-bar">
        <button class="small-btn" onclick="openGallery()">🖼️ Galeria</button>
        <button class="shutter" onclick="capturePhoto()" title="Zrób zdjęcie"></button>
        <button class="small-btn" onclick="captureSynthetic()">✨ Test HDR</button>
    </div>

    <canvas id="work-canvas" style="display:none;"></canvas>

    <script>
        let mode = 'HDR';
        let facingMode = 'environment';
        let stream = null;
        let isTop1 = true;

        function setMode(nextMode) {
            mode = nextMode;
            document.getElementById('btn-hdr').classList.toggle('active', mode === 'HDR');
            document.getElementById('btn-raw').classList.toggle('active', mode === 'RAW');
            document.getElementById('msg').textContent = mode === 'HDR'
                ? 'Tryb iPhone HDR: łączenie klatek, żywe kolory i ostrzenie.'
                : 'Tryb RAW: minimalna ingerencja w barwy.';
        }

        async function startCamera() {
            if (!isTop1) return;
            stopCamera();
            try {
                if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    throw new Error('Brak MediaDevices');
                }
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode, width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.style.display = 'block';
                document.getElementById('standby').style.display = 'none';
            } catch (_) {
                document.getElementById('standby').style.display = 'block';
                document.getElementById('standby').textContent = 'Kamera niedostępna lub zablokowana — kliknij „Test HDR”, aby wygenerować ujęcie testowe.';
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null;
            }
            const video = document.getElementById('video');
            video.srcObject = null;
            video.style.display = 'none';
        }

        function switchCam() {
            facingMode = facingMode === 'environment' ? 'user' : 'environment';
            startCamera();
        }

        // Proste przetwarzanie wieloklatkowe (w stylu iPhone HDR) + wyostrzanie i żywe barwy
        function processFrames(frames, currentMode) {
            const w = frames[0].width;
            const h = frames[0].height;
            const outCanvas = document.getElementById('work-canvas');
            outCanvas.width = w;
            outCanvas.height = h;
            const outCtx = outCanvas.getContext('2d');

            const count = frames.length;
            const avg = new Float32Array(w * h * 4);

            for (let f = 0; f < count; f++) {
                const d = frames[f].data;
                for (let i = 0; i < d.length; i += 4) {
                    avg[i] += d[i] / count;
                    avg[i + 1] += d[i + 1] / count;
                    avg[i + 2] += d[i + 2] / count;
                    avg[i + 3] = 255;
                }
            }

            const result = outCtx.createImageData(w, h);
            const rData = result.data;

            for (let i = 0; i < rData.length; i += 4) {
                let r = avg[i];
                let g = avg[i + 1];
                let b = avg[i + 2];

                if (currentMode === 'HDR') {
                    // Wyciąganie cieni + żywe, wyraziste kolory
                    const lum = 0.299 * r + 0.587 * g + 0.114 * b;
                    if (lum < 95) {
                        const lift = (95 - lum) * 0.22;
                        r += lift;
                        g += lift;
                        b += lift;
                    }
                    const mean = (r + g + b) / 3;
                    const sat = 1.24;
                    const contrast = 1.08;
                    r = (mean + (r - mean) * sat - 128) * contrast + 128;
                    g = (mean + (g - mean) * sat - 128) * contrast + 128;
                    b = (mean + (b - mean) * sat - 128) * contrast + 128;
                }

                rData[i] = Math.max(0, Math.min(255, r));
                rData[i + 1] = Math.max(0, Math.min(255, g));
                rData[i + 2] = Math.max(0, Math.min(255, b));
                rData[i + 3] = 255;
            }

            // Lekkie wyostrzanie w trybie HDR
            if (currentMode === 'HDR') {
                const copy = new Uint8ClampedArray(rData);
                for (let y = 1; y < h - 1; y++) {
                    for (let x = 1; x < w - 1; x++) {
                        const idx = (y * w + x) * 4;
                        for (let c = 0; c < 3; c++) {
                            const center = copy[idx + c];
                            const neighbors = (
                                copy[((y - 1) * w + x) * 4 + c] +
                                copy[((y + 1) * w + x) * 4 + c] +
                                copy[(y * w + (x - 1)) * 4 + c] +
                                copy[(y * w + (x + 1)) * 4 + c]
                            ) / 4;
                            const sharp = center + (center - neighbors) * 0.45;
                            rData[idx + c] = Math.max(0, Math.min(255, sharp));
                        }
                    }
                }
            }

            outCtx.putImageData(result, 0, 0);
            return outCanvas.toDataURL('image/jpeg', 0.85);
        }

        function capturePhoto() {
            const video = document.getElementById('video');
            if (!stream || video.readyState < 2) {
                captureSynthetic();
                return;
            }

            const w = 360;
            const h = 270;
            const temp = document.createElement('canvas');
            temp.width = w;
            temp.height = h;
            const tctx = temp.getContext('2d');

            const burstCount = mode === 'HDR' ? 3 : 1;
            const frames = [];
            for (let i = 0; i < burstCount; i++) {
                tctx.drawImage(video, 0, 0, w, h);
                frames.push(tctx.getImageData(0, 0, w, h));
            }

            const dataUrl = processFrames(frames, mode);
            savePhoto(dataUrl);
        }

        function captureSynthetic() {
            const w = 360;
            const h = 270;
            const frames = [];
            for (let f = 0; f < 3; f++) {
                const c = document.createElement('canvas');
                c.width = w;
                c.height = h;
                const ctx = c.getContext('2d');
                const grad = ctx.createLinearGradient(0, 0, w, h);
                grad.addColorStop(0, '#0f172a');
                grad.addColorStop(0.5, '#2563eb');
                grad.addColorStop(1, '#a855f7');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, w, h);

                ctx.fillStyle = 'rgba(255,255,255,0.85)';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText(`ZeniOS ${mode}`, 24, 54);
                ctx.font = '13px sans-serif';
                ctx.fillText(`Ujęcie testowe #${f + 1}`, 24, 80);

                frames.push(ctx.getImageData(0, 0, w, h));
            }
            const dataUrl = processFrames(frames, mode);
            savePhoto(dataUrl);
        }

        function savePhoto(dataUrl) {
            const p = window.parent;
            const existing = (p && p.StorageManager && p.StorageManager.get('gallery_photos', [])) || [];
            existing.unshift({
                id: 'img_' + Date.now(),
                mode,
                date: new Date().toLocaleTimeString().slice(0, 5),
                dataUrl
            });
            if (p && p.StorageManager) {
                p.StorageManager.set('gallery_photos', existing.slice(0, 20));
            }
            if (p && p.Widgets) {
                p.Widgets.syncData();
            }
            document.getElementById('msg').textContent = `Zapisano zdjęcie (${mode}) do Galerii.`;
        }

        function openGallery() {
            stopCamera();
            window.parent.postMessage({ type: 'OPEN_APP', appId: 'galeria' }, '*');
        }

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || data.type !== 'OS_PRIORITY') return;
            isTop1 = data.level === 'TOP_1';
            if (isTop1) {
                startCamera();
            } else {
                stopCamera();
            }
        });

        startCamera();
    </script>
</body>
</html>
