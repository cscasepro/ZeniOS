<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ustawienia</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px 16px 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }
        h1 { font-size: 20px; }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            color: #94a3b8;
            font-weight: 700;
        }
        .style-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .style-btn {
            padding: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(30, 41, 59, 0.8);
            color: #f8fafc;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: left;
        }
        .style-btn.active {
            border-color: #38bdf8;
            background: rgba(56, 189, 248, 0.22);
        }
        .wp-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .wp-chip {
            flex-shrink: 0;
            padding: 8px 12px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(30, 41, 59, 0.85);
            color: #f8fafc;
            font-size: 12px;
            cursor: pointer;
        }
        .toggle-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .btn-action {
            padding: 10px 12px;
            border-radius: 12px;
            border: none;
            background: rgba(56, 189, 248, 0.2);
            color: #7dd3fc;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-danger {
            background: rgba(239, 68, 68, 0.22);
            color: #fca5a5;
        }
        .log-box {
            background: #030712;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 8px;
            font-family: ui-monospace, monospace;
            font-size: 10px;
            color: #cbd5e1;
            max-height: 110px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Ustawienia • ZeniOS v1.0.2</h1>

    <div class="card">
        <div class="card-title">Styl ikon (jak iPhone)</div>
        <div class="style-grid">
            <button id="st-color" class="style-btn" onclick="setIconStyle('color')">🌈 Kolorowy</button>
            <button id="st-dark" class="style-btn" onclick="setIconStyle('dark')">🌑 Ciemny</button>
            <button id="st-bw" class="style-btn" onclick="setIconStyle('bw')">⚪ Szaro-biały</button>
            <button id="st-pink-purple" class="style-btn" onclick="setIconStyle('pink-purple')">🦄 Różowo-fioletowy</button>
        </div>
    </div>

    <div class="card">
        <div class="card-title">Tapety z repozytorium (default_wallpapers)</div>
        <div class="wp-row" id="wp-list"></div>
        <input type="file" id="custom-wp" accept="image/*" style="font-size:11px;color:#94a3b8;" onchange="uploadWallpaper(this)">
    </div>

    <div class="card">
        <div class="card-title">Zasilanie, skupienie i widżety</div>
        <div class="toggle-row">
            <span>🔋 Ochrona baterii (hamuje tło)</span>
            <input type="checkbox" id="chk-battery" onchange="toggleBattery(this.checked)">
        </div>
        <div class="toggle-row">
            <span>🌙 Tryb skupienia</span>
            <input type="checkbox" id="chk-focus" onchange="toggleFocus(this.checked)">
        </div>
        <div class="toggle-row">
            <span>🧩 Widżety na pulpicie</span>
            <input type="checkbox" id="chk-widgets" onchange="toggleWidgets(this.checked)">
        </div>
    </div>

    <div class="card">
        <div class="card-title">Nadzór w tle (Supervisor)</div>
        <div style="display:flex;gap:8px;">
            <button class="btn-action" onclick="loadLogs()">Odśwież logi</button>
            <button class="btn-action btn-danger" onclick="forceErrorBoot()">Test Error Boot</button>
        </div>
        <div id="logs" class="log-box">Kliknij „Odśwież logi”, aby zobaczyć zdarzenia systemu.</div>
    </div>

    <script>
        const p = window.parent;

        function initUi() {
            const wpList = document.getElementById('wp-list');
            wpList.innerHTML = '';
            const presets = (p && p.Wallpapers && p.Wallpapers.presets) || [
                { id: 'wp_1', name: 'Tapeta 1' },
                { id: 'wp_2', name: 'Tapeta 2' },
                { id: 'wp_3', name: 'Tapeta 3' },
                { id: 'wp_4', name: 'Tapeta 4' },
                { id: 'wp_5', name: 'Tapeta 5' },
                { id: 'wp_6', name: 'Tapeta 6' },
                { id: 'wp_7', name: 'Tapeta 7' }
            ];

            presets.forEach(wp => {
                const btn = document.createElement('button');
                btn.className = 'wp-chip';
                btn.textContent = wp.name;
                btn.onclick = () => {
                    p.postMessage({ type: 'SET_WALLPAPER', target: 'home', value: wp.id }, '*');
                    p.postMessage({ type: 'SET_WALLPAPER', target: 'lock', value: wp.id }, '*');
                };
                wpList.appendChild(btn);
            });

            const currentStyle = (p && p.IconTheme && p.IconTheme.getStyle()) || 'color';
            highlightStyle(currentStyle);

            document.getElementById('chk-battery').checked = Boolean(p && p.BatterySaver && p.BatterySaver.enabled);
            document.getElementById('chk-focus').checked = Boolean(p && p.FocusMode && p.FocusMode.enabled);
            document.getElementById('chk-widgets').checked = Boolean(p && p.Widgets && p.Widgets.config && p.Widgets.config.enabled !== false);
        }

        function highlightStyle(styleId) {
            ['color', 'dark', 'bw', 'pink-purple'].forEach(id => {
                document.getElementById('st-' + id)?.classList.toggle('active', id === styleId);
            });
        }

        function setIconStyle(style) {
            highlightStyle(style);
            p.postMessage({ type: 'SET_ICON_STYLE', style }, '*');
        }

        function uploadWallpaper(input) {
            const file = input.files && input.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                p.postMessage({ type: 'SET_WALLPAPER', target: 'home', value: reader.result }, '*');
                p.postMessage({ type: 'SET_WALLPAPER', target: 'lock', value: reader.result }, '*');
            };
            reader.readAsDataURL(file);
        }

        function toggleBattery(state) {
            p.postMessage({ type: 'TOGGLE_BATTERY_SAVER', state }, '*');
        }

        function toggleFocus(state) {
            p.postMessage({ type: 'TOGGLE_FOCUS_MODE', state }, '*');
        }

        function toggleWidgets(enabled) {
            p.postMessage({ type: 'UPDATE_WIDGETS_CONFIG', config: { enabled } }, '*');
        }

        function loadLogs() {
            p.postMessage({ type: 'GET_SUPERVISOR_LOGS' }, '*');
        }

        function forceErrorBoot() {
            p.postMessage({
                type: 'FORCE_ERROR_BOOT',
                code: 'ERR_MANUAL_RECOVERY_TEST',
                details: 'Ręczne wywołanie Error Boot z Ustawień'
            }, '*');
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'SUPERVISOR_LOGS') {
                const lines = (e.data.logs || []).map(l => `[${l.time}] ${l.level}: ${l.message}`);
                document.getElementById('logs').textContent = lines.length ? lines.join('\n') : 'Brak logów.';
            }
            if (e.data && e.data.type === 'OS_PRIORITY' && e.data.level === 'TOP_1') {
                initUi();
            }
        });

        initUi();
    </script>
</body>
</html>
