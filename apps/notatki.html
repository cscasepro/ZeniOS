<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notatki — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100%;
            height: 100%;
            background: #f2f2f7;
            color: #111827;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            padding: 46px 14px 62px;
            overflow-y: auto;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }
        .link-gold {
            background: none;
            border: none;
            color: #d97706;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
        .search-input {
            width: 100%;
            padding: 9px 13px;
            border-radius: 12px;
            border: none;
            background: #e5e5ea;
            font-size: 14px;
            margin-bottom: 14px;
            outline: none;
        }
        .sec-title {
            font-size: 16px;
            font-weight: 700;
            margin: 10px 0 6px;
        }
        .note-card {
            background: #ffffff;
            border-radius: 16px;
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
        }
        .pin-badge {
            width: 30px;
            height: 30px;
            border-radius: 9px;
            background: #f59e0b;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        .del-btn {
            background: #fee2e2;
            color: #b91c1c;
            border: none;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
        }
        .editor-modal {
            position: fixed;
            inset: 0;
            background: #ffffff;
            z-index: 30;
            display: none;
            flex-direction: column;
            padding: 46px 16px 36px;
            gap: 10px;
        }
        .editor-modal.open { display: flex; }
        .fmt-bar { display: flex; gap: 6px; flex-wrap: wrap; }
        .fmt-btn {
            padding: 5px 10px;
            border-radius: 9px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        .ed-title {
            font-size: 20px;
            font-weight: 700;
            border: none;
            outline: none;
        }
        .ed-body {
            flex: 1;
            border: none;
            outline: none;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            font-family: inherit;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <button class="link-gold" onclick="parent.Kernel?.goHome()">‹ Pulpit</button>
        <button class="link-gold" onclick="openEditor()">+ Nowa</button>
    </div>
    <h1>Notatki</h1>
    <input id="q" class="search-input" type="text" placeholder="Szukaj w notatkach" oninput="renderNotes()">

    <div id="pinned-sec"></div>
    <div id="recent-sec"></div>

    <div id="editor" class="editor-modal">
        <div class="topbar">
            <button class="link-gold" onclick="saveAndClose()">‹ Notatki</button>
            <div style="display:flex;gap:10px;">
                <button id="pin-toggle" class="link-gold" onclick="togglePinCurrent()">📌 Przypnij</button>
                <button class="link-gold" onclick="saveAndClose()">Gotowe</button>
            </div>
        </div>
        <div class="fmt-bar">
            <button class="fmt-btn" onclick="insertTag('**Pogrubienie**')">B</button>
            <button class="fmt-btn" onclick="insertTag('_Kursywa_')">I</button>
            <button class="fmt-btn" onclick="insertTag('\n☑ Zadanie')">☑ Checklista</button>
        </div>
        <input id="ed-title" class="ed-title" type="text" placeholder="Tytuł notatki">
        <textarea id="ed-body" class="ed-body" placeholder="Zacznij pisać..."></textarea>
    </div>

    <script>
        let notes = [];
        try {
            notes = parent.StorageManager?.get('zen_notes', null) || JSON.parse(localStorage.getItem('zenos_zen_notes') || 'null') || [
                { id: 1, title: 'Lista zakupów', body: '☑ Mleko\n☑ Kawa', pinned: true, date: 'Dzisiaj' }
            ];
        } catch {
            notes = [{ id: 1, title: 'Lista zakupów', body: '☑ Mleko\n☑ Kawa', pinned: true, date: 'Dzisiaj' }];
        }

        let activeId = null;
        let currentPinned = false;

        function persist() {
            try { parent.StorageManager?.set('zen_notes', notes); } catch {}
            try { localStorage.setItem('zenos_zen_notes', JSON.stringify(notes)); } catch {}
        }

        function renderNotes() {
            const q = document.getElementById('q').value.trim().toLowerCase();
            const filtered = notes.filter(n => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));
            const pinned = filtered.filter(n => n.pinned);
            const others = filtered.filter(n => !n.pinned);

            document.getElementById('pinned-sec').innerHTML = pinned.length
                ? `<div class="sec-title">Przypięte</div>` + pinned.map(cardHtml).join('')
                : '';
            document.getElementById('recent-sec').innerHTML = `<div class="sec-title">Ostatnie</div>` + others.map(cardHtml).join('');
        }

        function cardHtml(n) {
            return `
                <div class="note-card" onclick="openEditor(${n.id})">
                    <div style="display:flex;align-items:center;gap:10px;overflow:hidden;">
                        ${n.pinned ? '<div class="pin-badge">📌</div>' : ''}
                        <div style="overflow:hidden;">
                            <div style="font-weight:700;font-size:14.5px;">${n.title || 'Bez tytułu'}</div>
                            <div style="font-size:12px;color:#6b7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${n.date} • ${n.body.replace(/\n/g, ' ')}</div>
                        </div>
                    </div>
                    <button class="del-btn" onclick="event.stopPropagation(); deleteNote(${n.id})">Usuń</button>
                </div>
            `;
        }

        function deleteNote(id) {
            notes = notes.filter(n => n.id !== id);
            persist();
            renderNotes();
        }

        function openEditor(id = null) {
            activeId = id;
            const found = notes.find(n => n.id === id);
            document.getElementById('ed-title').value = found ? found.title : '';
            document.getElementById('ed-body').value = found ? found.body : '';
            currentPinned = found ? found.pinned : false;
            document.getElementById('pin-toggle').textContent = currentPinned ? '📌 Przypięta' : '📌 Przypnij';
            document.getElementById('editor').classList.add('open');
            document.getElementById('ed-title').focus();
        }

        function togglePinCurrent() {
            currentPinned = !currentPinned;
            document.getElementById('pin-toggle').textContent = currentPinned ? '📌 Przypięta' : '📌 Przypnij';
        }

        function insertTag(snippet) {
            const area = document.getElementById('ed-body');
            area.value += snippet;
            area.focus();
        }

        function saveAndClose() {
            const title = document.getElementById('ed-title').value.trim();
            const body = document.getElementById('ed-body').value.trim();
            if (title || body) {
                if (activeId) {
                    const idx = notes.findIndex(n => n.id === activeId);
                    if (idx !== -1) notes[idx] = { ...notes[idx], title: title || 'Bez tytułu', body, pinned: currentPinned, date: 'Dzisiaj' };
                } else {
                    notes.unshift({ id: Date.now(), title: title || 'Bez tytułu', body, pinned: currentPinned, date: 'Dzisiaj' });
                }
                persist();
            }
            document.getElementById('editor').classList.remove('open');
            renderNotes();
        }

        renderNotes();
    </script>
</body>
</html>
