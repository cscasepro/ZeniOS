<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wiadomości — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            background: linear-gradient(165deg, #2b2638 0%, #161822 48%, #0c1816 100%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .topbar {
            padding: 50px 16px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 17, 24, 0.52);
            backdrop-filter: blur(22px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
            color: #ffffff;
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .thread-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #38bdf8, #818cf8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            font-weight: 700;
        }
        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-row {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            max-width: 84%;
        }
        .msg-row.me {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        .mini-avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            flex-shrink: 0;
        }
        .msg-stack {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .sender-name {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.72);
            padding-left: 6px;
        }
        .bubble {
            padding: 10px 14px;
            border-radius: 20px;
            font-size: 14px;
            line-height: 1.38;
            backdrop-filter: blur(18px);
        }
        .msg-row.them .bubble {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-bottom-left-radius: 6px;
        }
        .msg-row.me .bubble {
            background: linear-gradient(135deg, #0a84ff, #2563eb);
            color: #ffffff;
            border-bottom-right-radius: 6px;
            box-shadow: 0 6px 18px rgba(10, 132, 255, 0.35);
        }
        .composer-wrap {
            padding: 10px 14px 28px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(15, 17, 24, 0.45);
            backdrop-filter: blur(22px);
        }
        .circle-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-size: 17px;
            cursor: pointer;
            flex-shrink: 0;
        }
        .input-pill {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .input-pill input {
            flex: 1;
            background: none;
            border: none;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .input-pill input::placeholder {
            color: rgba(255, 255, 255, 0.65);
        }
    </style>
</head>
<body>
    <header class="topbar">
        <button class="glass-btn" onclick="parent.Kernel?.goHome()">‹</button>
        <div class="thread-header">
            <div class="avatar">Z</div>
            <span style="font-size:13px;font-weight:700;">Ekipa ZenOS ›</span>
        </div>
        <button class="glass-btn" onclick="quickNoteBubble()">✦</button>
    </header>

    <div id="chat" class="chat-scroll">
        <div class="msg-row them">
            <div class="mini-avatar">M</div>
            <div class="msg-stack">
                <span class="sender-name">Maja</span>
                <div class="bubble">Testujemy nowy wygląd dymków i szkła w ZenOS. Jak wypada?</div>
            </div>
        </div>
        <div class="msg-row me">
            <div class="msg-stack">
                <div class="bubble">Wygląda bardzo czysto i responsywnie.</div>
            </div>
        </div>
        <div class="msg-row them">
            <div class="mini-avatar">K</div>
            <div class="msg-stack">
                <span class="sender-name">Kacper</span>
                <div class="bubble">Każda aplikacja ma swój własny charakter przy zachowaniu spójnego stylu.</div>
            </div>
        </div>
    </div>

    <div class="composer-wrap">
        <button class="circle-icon" onclick="quickNoteBubble()" title="Dodaj szybki załącznik">+</button>
        <div class="input-pill">
            <input id="msg-input" type="text" placeholder="Wiadomość" onkeydown="if(event.key==='Enter') sendMessage()">
            <button style="background:none;border:none;color:#fff;font-size:13px;font-weight:700;cursor:pointer;" onclick="sendMessage()">Wyślij</button>
        </div>
    </div>

    <script>
        function appendBubble(side, sender, text) {
            const chat = document.getElementById('chat');
            const row = document.createElement('div');
            row.className = `msg-row ${side}`;
            if (side === 'them') {
                row.innerHTML = `<div class="mini-avatar">${sender[0]}</div><div class="msg-stack"><span class="sender-name">${sender}</span><div class="bubble">${text}</div></div>`;
            } else {
                row.innerHTML = `<div class="msg-stack"><div class="bubble">${text}</div></div>`;
            }
            chat.appendChild(row);
            chat.scrollTop = chat.scrollHeight;
        }

        function sendMessage() {
            const inp = document.getElementById('msg-input');
            const text = inp.value.trim();
            if (!text) return;
            appendBubble('me', 'Ty', text);
            inp.value = '';
            setTimeout(() => {
                appendBubble('them', 'Maja', 'Odebrane w ZenOS!');
            }, 450);
        }

        function quickNoteBubble() {
            appendBubble('me', 'Ty', '📎 Podgląd motywu Liquid Glass');
        }
    </script>
</body>
</html>
