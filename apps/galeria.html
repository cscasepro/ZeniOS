<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { font-size: 20px; }
        button {
            padding: 7px 11px;
            border-radius: 10px;
            border: none;
            background: rgba(239, 68, 68, 0.22);
            color: #fca5a5;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            overflow: hidden;
        }
        .card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            display: block;
        }
        .meta {
            padding: 8px;
            font-size: 11px;
            color: #cbd5e1;
            display: flex;
            justify-content: space-between;
        }
        .empty {
            color: #94a3b8;
            font-size: 13px;
            margin-top: 30px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="top">
        <h1>Galeria</h1>
        <button onclick="clearPhotos()">Wyczyść</button>
    </div>
    <div id="grid" class="grid"></div>

    <script>
        function render() {
            const p = window.parent;
            const photos = (p && p.StorageManager && p.StorageManager.get('gallery_photos', [])) || [];
            const grid = document.getElementById('grid');
            grid.innerHTML = '';

            if (!photos.length) {
                grid.innerHTML = '<div class="empty" style="grid-column:1/-1;">Brak zapisanych zdjęć. Zrób ujęcie w Aparacie.</div>';
                return;
            }

            photos.forEach(ph => {
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `<img src="${ph.dataUrl}" alt="Zdjęcie"><div class="meta"><span>${ph.mode || 'HDR'}</span><span>${ph.date || ''}</span></div>`;
                grid.appendChild(div);
            });
        }

        function clearPhotos() {
            const p = window.parent;
            if (p && p.StorageManager) {
                p.StorageManager.set('gallery_photos', []);
            }
            if (p && p.Widgets) {
                p.Widgets.syncData();
            }
            render();
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'OS_PRIORITY' && e.data.level === 'TOP_1') {
                render();
            }
        });

        render();
    </script>
</body>
</html>
