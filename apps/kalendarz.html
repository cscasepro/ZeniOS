<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalkulator — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            width: 100%;
            height: 100%;
            background: #06080d;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 46px 14px 44px;
            overflow: hidden;
        }
        .calc-shell {
            width: 100%;
            max-width: 340px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.24);
            backdrop-filter: blur(14px);
            color: #ffffff;
            padding: 6px 13px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }
        .display {
            width: 100%;
            text-align: right;
            font-size: 54px;
            font-weight: 300;
            padding: 8px 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .keys {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button.key {
            height: 64px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            backdrop-filter: blur(16px);
            transition: transform 0.1s ease, filter 0.12s ease;
        }
        button.key:active {
            transform: scale(0.94);
            filter: brightness(1.25);
        }
        .fn { background: rgba(165, 165, 174, 0.85); color: #090c12; }
        .num { background: rgba(44, 46, 56, 0.88); color: #ffffff; }
        .op { background: linear-gradient(145deg, #ffab2e, #ff9500); color: #ffffff; }
        .zero {
            grid-column: span 2;
            text-align: left;
            padding-left: 24px;
        }
    </style>
</head>
<body>
    <div class="calc-shell">
        <div class="topbar">
            <button class="back-btn" onclick="parent.Kernel?.goHome()">‹ Pulpit</button>
            <span style="font-size:12px;opacity:0.65;font-weight:600;">Kalkulator</span>
            <span style="width:62px;"></span>
        </div>

        <div id="disp" class="display">0</div>

        <div class="keys">
            <button class="key fn" onclick="clearAll()">AC</button>
            <button class="key fn" onclick="toggleSign()">+/-</button>
            <button class="key fn" onclick="percent()">%</button>
            <button class="key op" onclick="setOp('/')">÷</button>

            <button class="key num" onclick="digit('7')">7</button>
            <button class="key num" onclick="digit('8')">8</button>
            <button class="key num" onclick="digit('9')">9</button>
            <button class="key op" onclick="setOp('*')">×</button>

            <button class="key num" onclick="digit('4')">4</button>
            <button class="key num" onclick="digit('5')">5</button>
            <button class="key num" onclick="digit('6')">6</button>
            <button class="key op" onclick="setOp('-')">−</button>

            <button class="key num" onclick="digit('1')">1</button>
            <button class="key num" onclick="digit('2')">2</button>
            <button class="key num" onclick="digit('3')">3</button>
            <button class="key op" onclick="setOp('+')">+</button>

            <button class="key num zero" onclick="digit('0')">0</button>
            <button class="key num" onclick="dot()">.</button>
            <button class="key op" onclick="equals()">=</button>
        </div>
    </div>

    <script>
        let cur = '0', prev = null, op = null, resetNext = false;

        function update() {
            document.getElementById('disp').textContent = cur;
        }
        function digit(d) {
            if (resetNext) { cur = d; resetNext = false; }
            else cur = cur === '0' ? d : cur + d;
            update();
        }
        function dot() {
            if (resetNext) { cur = '0.'; resetNext = false; }
            else if (!cur.includes('.')) cur += '.';
            update();
        }
        function clearAll() {
            cur = '0'; prev = null; op = null; resetNext = false;
            update();
        }
        function toggleSign() {
            cur = String(Number(cur) * -1);
            update();
        }
        function percent() {
            cur = String(Number(cur) / 100);
            update();
        }
        function setOp(nextOp) {
            if (op && !resetNext) equals();
            prev = Number(cur);
            op = nextOp;
            resetNext = true;
        }
        function equals() {
            if (op === null || prev === null) return;
            const b = Number(cur);
            let res = b;
            if (op === '+') res = prev + b;
            if (op === '-') res = prev - b;
            if (op === '*') res = prev * b;
            if (op === '/') res = b === 0 ? 'Błąd' : prev / b;
            cur = typeof res === 'number' ? String(Number(res.toFixed(8))) : res;
            op = null; prev = null; resetNext = true;
            update();
        }
    </script>
</body>
</html>
