<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zegar</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .card {
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 18px;
            padding: 16px;
            text-align: center;
        }
        .big-clock {
            font-size: 40px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .label {
            font-size: 11px;
            text-transform: uppercase;
            color: #94a3b8;
            letter-spacing: 0.6px;
            margin-bottom: 6px;
        }
        .sw-time {
            font-size: 28px;
            font-weight: 700;
            color: #38bdf8;
            margin: 8px 0 12px;
        }
        .btns {
            display: flex;
            justify-content: center;
            gap: 8px;
        }
        button {
            padding: 9px 14px;
            border-radius: 12px;
            border: none;
            background: #38bdf8;
            color: #090d16;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }
        button.sec {
            background: rgba(255, 255, 255, 0.12);
            color: #f8fafc;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="label">Czas systemowy</div>
        <div id="now-clock" class="big-clock">00:00:00</div>
    </div>

    <div class="card">
        <div class="label">Stoper</div>
        <div id="sw-display" class="sw-time">00.0s</div>
        <div class="btns">
            <button onclick="startSw()">Start</button>
            <button class="sec" onclick="stopSw()">Stop</button>
            <button class="sec" onclick="resetSw()">Reset</button>
        </div>
    </div>

    <script>
        function tickClock() {
            document.getElementById('now-clock').textContent = new Date().toTimeString().slice(0, 8);
        }
        tickClock();
        setInterval(tickClock, 1000);

        let swStart = null;
        let swAccumulated = 0;
        let swTimer = null;

        function renderSw() {
            const elapsed = swAccumulated + (swStart ? (performance.now() - swStart) : 0);
            document.getElementById('sw-display').textContent = `${(elapsed / 1000).toFixed(1)}s`;
        }

        function startSw() {
            if (swTimer) return;
            swStart = performance.now();
            swTimer = setInterval(renderSw, 100);
        }

        function stopSw() {
            if (swStart) {
                swAccumulated += performance.now() - swStart;
                swStart = null;
            }
            if (swTimer) {
                clearInterval(swTimer);
                swTimer = null;
            }
            renderSw();
        }

        function resetSw() {
            stopSw();
            swAccumulated = 0;
            renderSw();
        }
    </script>
</body>
</html>
