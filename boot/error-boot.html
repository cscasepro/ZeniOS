<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenOS Recovery</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: #07090f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            gap: 16px;
            text-align: center;
        }
        .card {
            max-width: 360px;
            width: 100%;
            padding: 22px;
            border-radius: 26px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .btn {
            padding: 12px 16px;
            border-radius: 999px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-primary { background: #0a84ff; color: #ffffff; }
        .btn-safe { background: rgba(255, 255, 255, 0.16); color: #ffffff; }
    </style>
</head>
<body>
    <div class="card">
        <div style="font-size:36px;">⚠️</div>
        <h1 style="font-size:20px;">Tryb odzyskiwania ZenOS</h1>
        <p id="err-code" style="font-size:13px;color:#93c5fd;font-weight:700;">ERR_SYSTEM_OVERLOAD</p>
        <p id="err-details" style="font-size:13px;color:rgba(255,255,255,0.75);">System wykrył powtarzający się błąd i wstrzymał normalny rozruch.</p>
        <button class="btn btn-primary" onclick="window.location.href='../index.html'">Uruchom ponownie</button>
        <button class="btn btn-safe" onclick="window.location.href='../index.html?safemode=1'">Uruchom w trybie bezpiecznym</button>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        if (params.get('code')) document.getElementById('err-code').textContent = params.get('code');
        if (params.get('details')) document.getElementById('err-details').textContent = params.get('details');
    </script>
</body>
</html>
