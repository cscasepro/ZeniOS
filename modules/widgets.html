<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Widgets — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            width: 100%;
            height: 100%;
            background: transparent;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            overflow: hidden;
        }
        .w-card {
            border-radius: 24px;
            padding: 12px 14px;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.24), rgba(255, 255, 255, 0.08));
            border: 1px solid rgba(255, 255, 255, 0.36);
            backdrop-filter: blur(22px) saturate(185%);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.24), inset 0 1px 1px rgba(255, 255, 255, 0.55);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }
        .w-kicker {
            font-size: 10.5px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            opacity: 0.82;
        }
        .w-big {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.05;
        }
        .w-sub {
            font-size: 12px;
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="w-card" onclick="openApp('kalendarz')">
        <span class="w-kicker">Kalendarz</span>
        <div>
            <div id="day-big" class="w-big">26</div>
            <div id="month-sub" class="w-sub">Listopad</div>
        </div>
    </div>

    <div class="w-card" onclick="openApp('pamiec')">
        <span class="w-kicker">Pamięć ZenOS</span>
        <div>
            <div style="font-size:15px;font-weight:700;">49.54 GB / 256 GB</div>
            <div class="w-sub">206.46 GB wolne</div>
        </div>
    </div>

    <script>
        const months = ['Styczeń', 'Luty', 'Marzec', 'Kwiecień', 'Maj', 'Czerwiec', 'Lipiec', 'Sierpień', 'Wrzesień', 'Październik', 'Listopad', 'Grudzień'];
        const now = new Date();
        document.getElementById('day-big').textContent = String(now.getDate());
        document.getElementById('month-sub').textContent = months[now.getMonth()];

        function openApp(appId) {
            parent.postMessage({ type: 'OPEN_APP', appId }, '*');
        }
    </script>
</body>
</html>
