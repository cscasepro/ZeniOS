<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Szukaj — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw;
            height: 100vh;
            padding: 56px 18px 68px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background: rgba(5, 8, 15, 0.68);
            backdrop-filter: blur(24px);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .search-bar {
            display: flex;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.34);
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }
        .close-btn {
            padding: 0 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-weight: 600;
            cursor: pointer;
        }
        .results {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
        }
        .res-item {
            padding: 12px 14px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.24);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="search-bar">
        <input id="q" type="text" placeholder="Szukaj w ZenOS..." oninput="render()">
        <button class="close-btn" onclick="closeSearch()">Zamknij</button>
    </div>
    <div id="results" class="results"></div>

    <script>
        function getApps() {
            return (parent.ZenManifest && parent.ZenManifest.apps) || [];
        }

        function render() {
            const term = document.getElementById('q').value.trim().toLowerCase();
            const box = document.getElementById('results');
            const matches = getApps().filter(a => !term || a.name.toLowerCase().includes(term) || a.id.toLowerCase().includes(term));
            box.innerHTML = matches.map(app => `
                <div class="res-item" onclick="launch('${app.id}')">
                    <span>${app.glyph || '✦'} <strong>${app.name}</strong></span>
                    <span style="font-size:11.5px;opacity:0.7;">Otwórz</span>
                </div>
            `).join('');
        }

        function launch(appId) {
            closeSearch();
            parent.postMessage({ type: 'OPEN_APP', appId }, '*');
        }

        function closeSearch() {
            parent.postMessage({ type: 'CLOSE_SEARCH' }, '*');
        }

        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'SEARCH_FOCUS') {
                render();
                setTimeout(() => document.getElementById('q').focus(), 50);
            }
        });

        render();
    </script>
</body>
</html>
