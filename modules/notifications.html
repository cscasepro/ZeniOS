<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            height: 100vh;
            background: rgba(9, 13, 22, 0.9);
            backdrop-filter: blur(18px);
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h2 { font-size: 16px; }
        .btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #f8fafc;
            padding: 6px 10px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
        }
        .list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .item {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px;
            font-size: 12px;
        }
        .item-head {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 4px;
        }
        .item-body {
            color: #cbd5e1;
        }
        .empty {
            color: #94a3b8;
            font-size: 13px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="top">
        <h2>Powiadomienia</h2>
        <div style="display:flex;gap:6px;">
            <button class="btn" onclick="clearAll()">Wyczyść</button>
            <button class="btn" onclick="closePanel()">Zamknij</button>
        </div>
    </div>
    <div id="list" class="list"></div>

    <script>
        function render(items = [], focusMode = false) {
            const list = document.getElementById('list');
            list.innerHTML = '';

            if (focusMode) {
                const banner = document.createElement('div');
                banner.className = 'item';
                banner.innerHTML = '<div class="item-head"><span>🌙 Tryb skupienia aktywny</span></div><div class="item-body">Nowe powiadomienia są wyciszone.</div>';
                list.appendChild(banner);
            }

            if (!items.length) {
                list.innerHTML += '<div class="empty">Brak powiadomień.</div>';
                return;
            }

            items.forEach(n => {
                const el = document.createElement('div');
                el.className = 'item';
                el.innerHTML = `<div class="item-head"><span>${esc(n.title)}</span><span>${esc(n.time || '')}</span></div><div class="item-body">${esc(n.body || '')}</div>`;
                list.appendChild(el);
            });
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function clearAll() {
            if (window.parent && window.parent.Notifications) {
                window.parent.Notifications.clearAll();
            }
        }

        function closePanel() {
            window.parent.postMessage({ type: 'GO_HOME' }, '*');
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'NOTIFICATIONS_UPDATED') {
                render(e.data.items || [], Boolean(e.data.focusMode));
            }
        });
    </script>
</body>
</html>
