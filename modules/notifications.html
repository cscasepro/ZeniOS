<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Powiadomienia — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 100vw;
            height: 100vh;
            padding: 56px 18px 68px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background: rgba(5, 8, 15, 0.62);
            backdrop-filter: blur(22px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn {
            padding: 7px 13px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .card {
            padding: 13px 15px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.28);
        }
        .card-top {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: 700;
            opacity: 0.85;
            margin-bottom: 3px;
        }
    </style>
</head>
<body>
    <div class="head">
        <strong style="font-size:18px;">Powiadomienia</strong>
        <div style="display:flex;gap:8px;">
            <button class="btn" onclick="clearList()">Wyczyść</button>
            <button class="btn" onclick="closePanel()">Zamknij</button>
        </div>
    </div>
    <div id="list" style="display:flex;flex-direction:column;gap:8px;"></div>

    <script>
        function closePanel() {
            parent.postMessage({ type: 'CLOSE_NOTIFICATIONS' }, '*');
        }

        function clearList() {
            parent.Notifications?.clearAll?.();
            render([]);
        }

        function render(items) {
            const box = document.getElementById('list');
            if (!items || !items.length) {
                box.innerHTML = '<div style="font-size:13.5px;opacity:0.75;margin-top:12px;">Brak nowych powiadomień.</div>';
                return;
            }
            box.innerHTML = items.map(n => `
                <div class="card">
                    <div class="card-top"><span>${n.title}</span><span>${n.time || 'teraz'}</span></div>
                    <div style="font-size:13.5px;">${n.body}</div>
                </div>
            `).join('');
        }

        window.addEventListener('message', e => {
            if (e.data && e.data.type === 'NOTIFICATIONS_UPDATED') {
                render(e.data.items || []);
            }
        });

        if (parent.Notifications) {
            render(parent.Notifications.getAll());
        }
    </script>
</body>
</html>
