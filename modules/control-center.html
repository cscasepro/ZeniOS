<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            height: 100vh;
            background: rgba(10, 10, 14, 0.92);
            backdrop-filter: blur(24px);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            padding: 52px 18px 24px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .title { font-size: 16px; font-weight: 700; }
        .close-btn {
            background: rgba(255, 255, 255, 0.16);
            border: none;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
        .box-card {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 24px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 112px;
        }
        .round-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .round-btn {
            aspect-ratio: 1 / 1;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.14);
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .round-btn.active {
            background: #ffffff;
            color: #000000;
        }
        .pill-btn {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 999px;
            padding: 12px 16px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
        }
        .pill-btn.active {
            background: #5e5ce6;
            border-color: #7d7aff;
        }
        .sub { font-size: 11px; color: #b0b0b8; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="top-row">
        <span class="title">Centrum sterowania</span>
        <button class="close-btn" onclick="closeCC()">Gotowe</button>
    </div>

    <div class="grid-2">
        <div class="box-card">
            <div style="font-size:13px;font-weight:700;">Zasilanie i ekran</div>
            <div id="power-info" class="sub">Priorytet TOP-1 aktywny</div>
            <button id="btn-battery" class="pill-btn" style="margin-top:8px;" onclick="toggleBattery()">
                <span>🔋 Bateria</span>
                <span id="bat-state">OFF</span>
            </button>
        </div>

        <div class="box-card">
            <div style="font-size:13px;font-weight:700;">Odtwarzacz</div>
            <div class="sub">Nie odtwarza</div>
            <div style="display:flex;gap:14px;font-size:18px;margin-top:8px;">
                <span>⏮</span><span>▶</span><span>⏭</span>
            </div>
        </div>
    </div>

    <button id="btn-focus" class="pill-btn" onclick="toggleFocus()">
        <span>🌙 Skupienie</span>
        <span id="focus-state">Wyłączone</span>
    </button>

    <div class="round-row">
        <button id="btn-torch" class="round-btn" onclick="toggleTorch()" title="Latarka">🔦</button>
        <button class="round-btn" onclick="openApp('kalkulator')" title="Kalkulator">🧮</button>
        <button class="round-btn" onclick="openApp('zegar')" title="Zegar">⏰</button>
        <button class="round-btn" onclick="openApp('sprzatacz')" title="Sprzątacz">🧹</button>
    </div>

    <div class="grid-2">
        <button class="pill-btn" onclick="openApp('ustawienia')">⚙️ Ustawienia</button>
        <button class="pill-btn" onclick="openApp('aktualizacje')">🔄 Moduły v1.0.2</button>
    </div>

    <script>
        let torchOn = false;
        let batteryOn = false;
        let focusOn = false;

        function sync() {
            document.getElementById('btn-torch').classList.toggle('active', torchOn);
            document.getElementById('btn-battery').classList.toggle('active', batteryOn);
            document.getElementById('bat-state').textContent = batteryOn ? 'OSZCZ' : 'OFF';
            document.getElementById('power-info').textContent = batteryOn
                ? 'Ochrona baterii hamuje tło'
                : 'Priorytet TOP-1 aktywny';

            document.getElementById('btn-focus').classList.toggle('active', focusOn);
            document.getElementById('focus-state').textContent = focusOn ? 'Włączone' : 'Wyłączone';
        }

        function toggleTorch() {
            torchOn = !torchOn;
            sync();
            window.parent.postMessage({ type: 'TOGGLE_FLASHLIGHT', state: torchOn }, '*');
        }

        function toggleBattery() {
            batteryOn = !batteryOn;
            sync();
            window.parent.postMessage({ type: 'TOGGLE_BATTERY_SAVER', state: batteryOn }, '*');
        }

        function toggleFocus() {
            focusOn = !focusOn;
            sync();
            window.parent.postMessage({ type: 'TOGGLE_FOCUS_MODE', state: focusOn }, '*');
        }

        function openApp(appId) {
            closeCC();
            window.parent.postMessage({ type: 'OPEN_APP', appId }, '*');
        }

        function closeCC() {
            window.parent.postMessage({ type: 'GO_HOME' }, '*');
        }

        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'OVERLAY_OPENED') {
                const p = window.parent;
                if (p && p.BatterySaver) batteryOn = Boolean(p.BatterySaver.enabled);
                if (p && p.FocusMode) focusOn = Boolean(p.FocusMode.enabled);
                sync();
            }
        });

        sync();
    </script>
</body>
</html>
