<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockscreen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            height: 100vh;
            background: linear-gradient(160deg, #090d16 0%, #172554 55%, #1e1b4b 100%);
            background-size: cover;
            background-position: center;
            color: #f8fafc;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 52px 20px 28px;
            position: relative;
            overflow: hidden;
        }
        .scrim {
            position: absolute;
            inset: 0;
            background: rgba(2, 6, 23, 0.42);
            z-index: 0;
        }
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }
        .top-clock {
            text-align: center;
        }
        .time {
            font-size: 56px;
            font-weight: 700;
            letter-spacing: -1px;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.45);
        }
        .sub {
            font-size: 13px;
            color: rgba(248, 250, 252, 0.85);
            margin-top: 4px;
        }
        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
            margin: 16px 0;
        }
        .notif-card {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 14px;
            padding: 10px 12px;
            font-size: 12px;
        }
        .notif-head {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 2px;
        }
        .notif-body {
            color: #cbd5e1;
        }
        .unlock-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .unlock-btn {
            width: 100%;
            max-width: 260px;
            padding: 13px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.16);
            backdrop-filter: blur(12px);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .unlock-btn:active {
            transform: scale(0.97);
        }
        .hint {
            font-size: 11px;
            color: rgba(226, 232, 240, 0.75);
        }
    </style>
</head>
<body>
    <div class="scrim"></div>
    <div class="content">
        <div class="top-clock">
            <div id="ls-time" class="time">12:00</div>
            <div class="sub">ZeniOS v1.0.2 • Ekran blokady</div>
        </div>

        <div id="ls-notifs" class="notif-list"></div>

        <div class="unlock-wrap">
            <button class="unlock-btn" onclick="unlock()">Odblokuj ZeniOS</button>
            <div class="hint">Kliknij przycisk, aby przejść do pulpitu</div>
        </div>
    </div>

    <script>
        function unlock() {
            window.parent.postMessage({ type: 'UNLOCK_SCREEN' }, '*');
        }

        function renderNotifs(items = [], focusMode = false) {
            const box = document.getElementById('ls-notifs');
            box.innerHTML = '';
            if (focusMode) {
                box.innerHTML = '<div class="notif-card"><div class="notif-head"><span>🌙 Tryb skupienia</span></div><div class="notif-body">Powiadomienia są wyciszone.</div></div>';
                return;
            }
            items.slice(0, 4).forEach(n => {
                const div = document.createElement('div');
                div.className = 'notif-card';
                div.innerHTML = `<div class="notif-head"><span>${escapeHtml(n.title)}</span><span>${escapeHtml(n.time || '')}</span></div><div class="notif-body">${escapeHtml(n.body || '')}</div>`;
                box.appendChild(div);
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || typeof data !== 'object') return;
            if (data.type === 'OS_CLOCK' && data.time) {
                document.getElementById('ls-time').textContent = data.time;
            }
            if (data.type === 'SET_LOCK_WALLPAPER' && data.url) {
                document.body.style.backgroundImage = `url("${data.url}")`;
            }
            if (data.type === 'NOTIFICATIONS_UPDATED') {
                renderNotifs(data.items || [], Boolean(data.focusMode));
            }
        });
    </script>
</body>
</html>
