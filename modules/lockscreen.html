<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ekran blokady</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            width: 100%;
            height: 100%;
            background: linear-gradient(165deg, rgba(15, 23, 42, 0.88) 0%, rgba(10, 14, 26, 0.94) 55%, rgba(5, 7, 14, 0.98) 100%);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 68px 20px 38px;
            overflow: hidden;
        }
        .clock-header {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .date-line {
            font-size: 16px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.92);
        }
        .big-clock {
            font-size: 74px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
        }
        .status-pills {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .pill-glass {
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.26);
            backdrop-filter: blur(18px);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .bottom-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .quick-actions {
            width: 100%;
            max-width: 320px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 12px;
        }
        .circle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(18px);
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .unlock-pill {
            width: 100%;
            max-width: 310px;
            padding: 12px 18px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.16);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(18px);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="clock-header">
        <div id="ls-date" class="date-line">Czwartek, 26 listopada</div>
        <div id="ls-clock" class="big-clock">15:58</div>
        <div class="status-pills">
            <span id="ls-bat" class="pill-glass">🔋 100%</span>
            <span class="pill-glass">⚡ TOP-1</span>
        </div>
    </div>

    <div class="bottom-area">
        <div class="quick-actions">
            <button class="circle-btn" onclick="toggleTorch()" aria-label="Latarka">🔦</button>
            <button class="circle-btn" onclick="openCamera()" aria-label="Aparat">📷</button>
        </div>

        <button class="unlock-pill" onclick="unlock()">Przesuń w górę lub kliknij, aby odblokować</button>
    </div>

    <script>
        let torchOn = false;

        function applyTelemetry(t) {
            if (!t) return;
            if (t.time) document.getElementById('ls-clock').textContent = t.time;
            if (t.dateLabel) document.getElementById('ls-date').textContent = t.dateLabel;
            if (typeof t.level === 'number') {
                document.getElementById('ls-bat').textContent = `${t.charging ? '⚡' : '🔋'} ${t.level}%`;
            }
        }

        function unlock() {
            parent.postMessage({ type: 'UNLOCK_DEVICE' }, '*');
        }

        function toggleTorch() {
            torchOn = !torchOn;
            parent.postMessage({ type: 'TORCH_STATE', active: torchOn, intensity: 90 }, '*');
        }

        function openCamera() {
            parent.postMessage({ type: 'OPEN_APP', appId: 'aparat' }, '*');
        }

        window.addEventListener('message', (e) => {
            if (!e.data) return;
            if (e.data.type === 'TELEMETRY_UPDATED') applyTelemetry(e.data.telemetry);
        });

        if (parent.DeviceTelemetry) {
            applyTelemetry(parent.DeviceTelemetry.getSnapshot());
        }
    </script>
</body>
</html>
