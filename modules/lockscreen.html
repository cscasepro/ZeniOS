<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lockscreen</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            height: 100vh;
            background-color: #050811;
            background-image: linear-gradient(160deg, #0b132b 0%, #1c2541 55%, #111827 100%);
            background-size: cover;
            background-position: center;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 64px 22px 30px;
            position: relative;
            overflow: hidden;
        }
        .scrim {
            position: absolute;
            inset: 0;
            background: rgba(4, 7, 16, 0.92);
            z-index: 0;
        }
        .content {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }
        .top-clock {
            text-align: center;
        }
        .lock-glyph {
            font-size: 16px;
            margin-bottom: 6px;
            opacity: 0.9;
        }
        .time {
            font-size: 64px;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1.05;
        }
        .sub {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.72);
            margin-top: 6px;
        }
        .notif-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
            margin: 16px 0;
        }
        .notif-card {
            background: rgba(44, 44, 46, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 18px;
            padding: 12px 14px;
            font-size: 12px;
        }
        .notif-head {
            display: flex;
            justify-content: space-between;
            font-weight: 700;
            margin-bottom: 3px;
        }
        .notif-body {
            color: #d1d1d6;
        }
        .unlock-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .unlock-btn {
            width: 100%;
            max-width: 270px;
            padding: 14px 18px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.24);
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .home-bar {
            width: 120px;
            height: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.75);
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div class="scrim"></div>
    <div class="content">
        <div class="top-clock">
            <div class="lock-glyph">🔒</div>
            <div id="ls-time" class="time">09:41</div>
            <div class="sub">ZeniOS v1.0.2 • Ekran blokady</div>
        </div>

        <div id="ls-notifs" class="notif-list"></div>

        <div class="unlock-wrap">
            <button class="unlock-btn" onclick="unlock()">Odblokuj ZeniOS</button>
            <div class="home-bar"></div>
        </div>
    </div>

    <script>
        function unlock() {
            window.parent.postMessage({ type: 'UNLOCK_SCREEN' }, '*');
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
        }

        function renderNotifs(items = [], focusMode = false) {
            const box = document.getElementById('ls-notifs');
            box.innerHTML = '';
            if (focusMode) {
                box.innerHTML = '<div class="notif-card"><div class="notif-head"><span>🌙 Tryb skupienia</span></div><div class="notif-body">Powiadomienia wyciszone.</div></div>';
                return;
            }
            items.slice(0, 4).forEach(n => {
                const div = document.createElement('div');
                div.className = 'notif-card';
                div.innerHTML = `<div class="notif-head"><span>${esc(n.title)}</span><span>${esc(n.time || '')}</span></div><div class="notif-body">${esc(n.body || '')}</div>`;
                box.appendChild(div);
            });
        }

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || typeof data !== 'object') return;
            if (data.type === 'OS_CLOCK' && data.time) {
                document.getElementById('ls-time').textContent = data.time;
            }
            if (data.type === 'SET_LOCK_WALLPAPER' && data.url) {
                document.body.style.backgroundImage = `url("${data.url}")`;
            }
            if (data.type === 'NOTIFICATIONS_UPDATED') {
                renderNotifs(data.items || [], Boolean(data.focusMode));
            }
        });
    </script>
</body>
</html>
