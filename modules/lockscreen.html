<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lock Screen — ZenOS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            width: 100vw;
            height: 100vh;
            padding: 64px 20px 26px;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            background: radial-gradient(circle at 70% 25%, rgba(37, 99, 235, 0.35), rgba(6, 9, 19, 0.72));
            backdrop-filter: blur(16px);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        .glass {
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0.08));
            border: 1px solid rgba(255, 255, 255, 0.36);
            backdrop-filter: blur(22px) saturate(180%);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.28), inset 0 1px 1px rgba(255, 255, 255, 0.55);
        }
        .top-block {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        .date-txt {
            font-size: 18px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.84);
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.35);
        }
        .clock-glass {
            font-size: clamp(86px, 24vw, 132px);
            font-weight: 700;
            line-height: 0.96;
            letter-spacing: -3px;
            color: rgba(255, 255, 255, 0.36);
            -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.75);
            text-shadow: 0 10px 28px rgba(0, 0, 0, 0.25), inset 0 2px 6px rgba(255, 255, 255, 0.65);
        }
        .ls-widgets {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .ls-chip {
            padding: 7px 13px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
        }
        .notif-stack {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 210px;
            overflow-y: auto;
        }
        .notif-card {
            padding: 12px 14px;
            border-radius: 20px;
            font-size: 13.5px;
        }
        .notif-head {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: 700;
            opacity: 0.85;
            margin-bottom: 2px;
        }
        .bottom-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
        }
        .shortcuts {
            width: 100%;
            max-width: 420px;
            display: flex;
            justify-content: space-between;
            padding: 0 8px;
        }
        .circle-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: none;
            color: #ffffff;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .circle-btn.active {
            background: #ffffff;
            color: #090d16;
        }
        .unlock-pill {
            border: none;
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .bar-ind {
            width: 134px;
            height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.85);
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="top-block">
        <div id="ls-date" class="date-txt">Czwartek, 26 listopada</div>
        <div id="ls-clock" class="clock-glass">15:00</div>
        <div class="ls-widgets">
            <div class="ls-chip glass">🌤️ ZenOS • Liquid Glass</div>
            <div id="ls-saver" class="ls-chip glass">⚡ TOP-1</div>
        </div>
    </div>

    <div id="ls-notifs" class="notif-stack"></div>

    <div class="bottom-block">
        <div class="shortcuts">
            <button id="torch-btn" class="circle-btn glass" onclick="toggleTorch()" title="Latarka">🔦</button>
            <button class="circle-btn glass" onclick="openCamera()" title="Aparat">📷</button>
        </div>
        <button class="unlock-pill glass" onclick="unlock()">Przesuń w górę lub kliknij, aby odblokować</button>
        <div class="bar-ind" onclick="unlock()"></div>
    </div>

    <script>
        let torchOn = false;
        let focusOn = false;
        let items = [];

        const days = ['Niedziela', 'Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota'];
        const months = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];

        function updateTime() {
            const now = new Date();
            document.getElementById('ls-clock').textContent = now.toTimeString().slice(0, 5);
            document.getElementById('ls-date').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
        }
        updateTime();
        setInterval(updateTime, 1000);

        function renderNotifs() {
            const box = document.getElementById('ls-notifs');
            box.innerHTML = '';
            if (focusOn) {
                box.innerHTML = '<div class="notif-card glass"><div class="notif-head"><span>🌙 Tryb skupienia</span><span>teraz</span></div><div>Powiadomienia są wyciszone.</div></div>';
                return;
            }
            items.slice(0, 3).forEach(n => {
                const div = document.createElement('div');
                div.className = 'notif-card glass';
                div.onclick = unlock;
                div.innerHTML = `<div class="notif-head"><span>${n.title}</span><span>${n.time}</span></div><div>${n.body}</div>`;
                box.appendChild(div);
            });
        }

        function unlock() {
            parent.postMessage({ type: 'UNLOCK_DEVICE' }, '*');
        }

        function openCamera() {
            parent.postMessage({ type: 'OPEN_APP', appId: 'aparat' }, '*');
        }

        function toggleTorch() {
            torchOn = !torchOn;
            document.getElementById('torch-btn').classList.toggle('active', torchOn);
            parent.postMessage({ type: 'TORCH_STATE', active: torchOn, intensity: 85 }, '*');
        }

        let startY = 0;
        document.body.addEventListener('touchstart', e => { startY = e.touches[0].clientY; }, { passive: true });
        document.body.addEventListener('touchend', e => {
            if (startY - e.changedTouches[0].clientY > 60) unlock();
        }, { passive: true });

        window.addEventListener('message', e => {
            if (!e.data || !e.data.type) return;
            if (e.data.type === 'NOTIFICATIONS_UPDATED') {
                items = e.data.items || [];
                renderNotifs();
            } else if (e.data.type === 'FOCUS_MODE_CHANGED') {
                focusOn = Boolean(e.data.enabled);
                renderNotifs();
            } else if (e.data.type === 'BATTERY_SAVER_CHANGED') {
                document.getElementById('ls-saver').textContent = e.data.enabled ? '🔋 Oszczędzanie' : '⚡ TOP-1';
            }
        });
    </script>
</body>
</html>
