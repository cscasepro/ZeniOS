<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ekran blokady — ZenOS</title>
    <style>
        :root {
            --ls-clock-size: clamp(82px, 21vw, 134px);
            --ls-clock-weight: 700;
            --ls-clock-font: -apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif;
            --ls-clock-color: rgba(255, 255, 255, 0.72);
            --ls-clock-stroke: rgba(255, 255, 255, 0.78);
            --ls-glass-bg: rgba(255, 255, 255, 0.16);
            --ls-glass-border: rgba(255, 255, 255, 0.32);
            --ls-text: #ffffff;
            --ls-muted: rgba(255, 255, 255, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
            color: var(--ls-text);
            background: #060913;
        }

        .ls-root {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.26s ease;
        }

        .ls-root.unlocking {
            transform: translateY(-100%);
            opacity: 0.25;
        }

        .ls-wallpaper-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 1;
            transition: background-image 0.25s ease;
        }

        .ls-wallpaper-fg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            z-index: 3;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.25s ease;
        }

        .ls-wallpaper-fg.depth-active {
            opacity: 1;
        }

        .ls-scrim {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0.2) 0%,
                rgba(0, 0, 0, 0.08) 50%,
                rgba(0, 0, 0, 0.32) 100%
            );
            pointer-events: none;
        }

        .ls-top {
            position: relative;
            z-index: 2;
            padding: 58px 18px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: enterClock 0.4s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes enterClock {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .ls-date-row {
            font-size: 16px;
            font-weight: 600;
            color: var(--ls-text);
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
            margin-bottom: 4px;
        }

        .ls-clock {
            font-family: var(--ls-clock-font);
            font-size: var(--ls-clock-size);
            font-weight: var(--ls-clock-weight);
            line-height: 0.94;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            color: var(--ls-clock-color);
            cursor: ns-resize;
            touch-action: none;
            transition: font-size 0.14s ease, color 0.2s ease, font-family 0.2s ease;
        }

        .ls-clock.style-glass {
            color: var(--ls-clock-color);
            -webkit-text-stroke: 1.25px var(--ls-clock-stroke);
            text-shadow: 0 8px 24px rgba(0, 0, 0, 0.32);
        }

        .ls-clock.style-solid {
            color: var(--ls-clock-stroke);
            -webkit-text-stroke: 0;
            text-shadow: 0 6px 20px rgba(0, 0, 0, 0.38);
        }

        .ls-clock.style-outline {
            color: transparent;
            -webkit-text-stroke: 2px var(--ls-clock-stroke);
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .ls-widgets-under {
            position: relative;
            z-index: 4;
            margin-top: 14px;
            width: 100%;
            max-width: 380px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .ls-widget {
            background: var(--ls-glass-bg);
            backdrop-filter: blur(18px) saturate(170%);
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            border: 1px solid var(--ls-glass-border);
            border-radius: 20px;
            padding: 11px 13px;
            text-align: left;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            transition: transform 0.14s ease;
        }

        .ls-widget:active {
            transform: scale(0.96);
        }

        .w-head {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--ls-muted);
            margin-bottom: 3px;
        }

        .w-main {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.15;
        }

        .w-sub {
            font-size: 12px;
            color: var(--ls-muted);
            margin-top: 2px;
        }

        .ls-notifications {
            position: relative;
            z-index: 4;
            width: 100%;
            max-width: 380px;
            margin: 14px auto 0;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 210px;
            overflow-y: auto;
            scrollbar-width: none;
        }

        .ls-notifications::-webkit-scrollbar {
            display: none;
        }

        .ls-notif-card {
            background: var(--ls-glass-bg);
            backdrop-filter: blur(18px) saturate(170%);
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            border: 1px solid var(--ls-glass-border);
            border-radius: 18px;
            padding: 10px 13px;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
            cursor: pointer;
        }

        .ls-notif-top {
            display: flex;
            justify-content: space-between;
            font-size: 11.5px;
            font-weight: 700;
            color: var(--ls-muted);
            margin-bottom: 2px;
        }

        .ls-notif-title {
            font-size: 13.5px;
            font-weight: 700;
        }

        .ls-notif-body {
            font-size: 12.5px;
            color: var(--ls-muted);
            margin-top: 1px;
        }

        .ls-bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 32px;
            z-index: 5;
            padding: 0 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .ls-shortcuts {
            width: 100%;
            max-width: 340px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ls-circle-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: var(--ls-glass-bg);
            backdrop-filter: blur(18px) saturate(170%);
            -webkit-backdrop-filter: blur(18px) saturate(170%);
            border: 1px solid var(--ls-glass-border);
            color: #ffffff;
            font-size: 21px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            cursor: pointer;
            transition: transform 0.14s ease, background 0.2s ease;
        }

        .ls-circle-btn:active {
            transform: scale(0.9);
        }

        .ls-circle-btn.active-torch {
            background: rgba(255, 255, 255, 0.9);
            color: #0b0f19;
        }

        .ls-swipe-hint {
            font-size: 12px;
            font-weight: 600;
            color: var(--ls-muted);
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
            cursor: pointer;
        }

        .ls-page-dots {
            display: flex;
            align-items: center;
            gap: 7px;
            background: rgba(0, 0, 0, 0.28);
            backdrop-filter: blur(10px);
            padding: 5px 10px;
            border-radius: 999px;
        }

        .ls-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.42);
            cursor: pointer;
        }

        .ls-dot.active {
            background: #ffffff;
            transform: scale(1.25);
        }

        .ls-editor {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 30;
            flex-direction: column;
            justify-content: flex-end;
            background: rgba(0, 0, 0, 0.35);
        }

        .ls-editor.open {
            display: flex;
        }

        .ls-editor-top {
            position: absolute;
            top: 46px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ed-pill {
            background: rgba(24, 24, 28, 0.82);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.24);
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 999px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .ed-drawer {
            background: rgba(22, 22, 26, 0.9);
            backdrop-filter: blur(22px) saturate(175%);
            -webkit-backdrop-filter: blur(22px) saturate(175%);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            padding: 16px 16px 36px;
            max-height: 62vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .ed-sec-title {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: rgba(255, 255, 255, 0.68);
            margin-bottom: 6px;
        }

        .ed-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .ed-chip {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
        }

        .ed-chip.active {
            background: #0a84ff;
            border-color: #0a84ff;
        }

        .color-dot {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.45);
            cursor: pointer;
        }

        .color-dot.active {
            border-color: #ffffff;
            transform: scale(1.15);
            box-shadow: 0 0 0 2px #0a84ff;
        }

        .widget-chip-manage {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 14px;
            padding: 6px 10px;
            font-size: 12.5px;
        }

        .widget-chip-manage button {
            background: none;
            border: none;
            color: #ffffff;
            font-weight: 700;
            cursor: pointer;
            padding: 0 3px;
        }
    </style>
</head>
<body>
    <div id="ls-root" class="ls-root">
        <div id="ls-bg" class="ls-wallpaper-bg"></div>
        <div class="ls-scrim"></div>
        <div id="ls-fg" class="ls-wallpaper-fg"></div>

        <header class="ls-top">
            <div id="ls-date" class="ls-date-row">Czwartek, 26 listopada</div>
            <div id="ls-clock" class="ls-clock style-glass" title="Przeciągnij w pionie, aby zmienić rozmiar">16:27</div>
            <div id="ls-widgets-under" class="ls-widgets-under"></div>
        </header>

        <div id="ls-notifications" class="ls-notifications"></div>

        <footer class="ls-bottom">
            <div class="ls-shortcuts">
                <button id="sc-left" class="ls-circle-btn" onclick="triggerShortcut('left')" aria-label="Lewy skrót">🔦</button>
                <div class="ls-page-dots" id="ls-dots"></div>
                <button id="sc-right" class="ls-circle-btn" onclick="triggerShortcut('right')" aria-label="Prawy skrót">📷</button>
            </div>
            <div class="ls-swipe-hint" onclick="unlockDevice()">Przesuń w górę, aby odblokować</div>
        </footer>

        <div id="ls-editor" class="ls-editor">
            <div class="ls-editor-top">
                <button class="ed-pill" onclick="closeEditor()">Anuluj</button>
                <div style="display:flex;gap:8px;">
                    <button class="ed-pill" onclick="createNewScreen()">+ Nowy ekran</button>
                    <button class="ed-pill" style="background:#0a84ff;border-color:#0a84ff;" onclick="closeEditor()">Gotowe</button>
                </div>
            </div>

            <div class="ed-drawer" onclick="event.stopPropagation()">
                <div>
                    <div class="ed-sec-title">Ekrany blokady</div>
                    <div id="ed-screens-list" class="ed-row"></div>
                </div>

                <div>
                    <div class="ed-sec-title">Tapeta i Depth Effect</div>
                    <div class="ed-row">
                        <label class="ed-chip" style="cursor:pointer;">
                            Własne zdjęcie
                            <input type="file" accept="image/*" style="display:none;" onchange="handleCustomWallpaper(event)">
                        </label>
                        <button id="btn-depth" class="ed-chip" onclick="toggleDepthEffect()">Depth Effect: WYŁ.</button>
                        <label id="fg-upload-wrap" class="ed-chip" style="display:none;cursor:pointer;">
                            Warstwa obiektu (PNG)
                            <input type="file" accept="image/*" style="display:none;" onchange="handleDepthForeground(event)">
                        </label>
                    </div>
                </div>

                <div>
                    <div class="ed-sec-title">Styl, czcionka i rozmiar zegara</div>
                    <div class="ed-row" style="margin-bottom:8px;">
                        <button class="ed-chip" data-style="glass" onclick="setClockStyle('glass')">Liquid Glass</button>
                        <button class="ed-chip" data-style="solid" onclick="setClockStyle('solid')">Pełny</button>
                        <button class="ed-chip" data-style="outline" onclick="setClockStyle('outline')">Kontur</button>
                    </div>
                    <div class="ed-row" style="margin-bottom:8px;">
                        <button class="ed-chip" data-font="sans" onclick="setClockFont('sans')">Smukły</button>
                        <button class="ed-chip" data-font="rounded" onclick="setClockFont('rounded')">Zaokrąglony</button>
                        <button class="ed-chip" data-font="serif" onclick="setClockFont('serif')">Klasyczny</button>
                        <button class="ed-chip" data-font="mono" onclick="setClockFont('mono')">Cyfrowy</button>
                    </div>
                    <div class="ed-row">
                        <span style="font-size:12px;color:var(--ls-muted);">Rozmiar:</span>
                        <input id="ed-size-range" type="range" min="68" max="156" value="108" oninput="setClockSize(this.value)" style="flex:1;accent-color:#0a84ff;">
                    </div>
                </div>

                <div>
                    <div class="ed-sec-title">Kolor zegara</div>
                    <div id="ed-colors" class="ed-row"></div>
                </div>

                <div>
                    <div class="ed-sec-title">Widżety pod zegarem</div>
                    <div class="ed-row" style="margin-bottom:8px;">
                        <button class="ed-chip" onclick="addWidget('weather')">+ Pogoda</button>
                        <button class="ed-chip" onclick="addWidget('battery')">+ Bateria</button>
                        <button class="ed-chip" onclick="addWidget('calendar')">+ Kalendarz</button>
                        <button class="ed-chip" onclick="addWidget('alarm')">+ Alarm</button>
                        <button class="ed-chip" onclick="addWidget('clock')">+ Zegar</button>
                    </div>
                    <div id="ed-active-widgets" class="ed-row"></div>
                </div>

                <div>
                    <div class="ed-sec-title">Dolne skróty</div>
                    <div class="ed-row">
                        <span style="font-size:12px;">Lewy:</span>
                        <select id="sel-sc-left" class="ed-chip" onchange="setShortcut('left', this.value)">
                            <option value="torch">🔦 Latarka</option>
                            <option value="camera">📷 Aparat</option>
                            <option value="clock">⏰ Zegar</option>
                            <option value="calculator">🧮 Kalkulator</option>
                            <option value="notes">📝 Notatki</option>
                        </select>
                        <span style="font-size:12px;">Prawy:</span>
                        <select id="sel-sc-right" class="ed-chip" onchange="setShortcut('right', this.value)">
                            <option value="camera">📷 Aparat</option>
                            <option value="torch">🔦 Latarka</option>
                            <option value="clock">⏰ Zegar</option>
                            <option value="calculator">🧮 Kalkulator</option>
                            <option value="notes">📝 Notatki</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'zenos_lockscreens_v2';
        const COLORS = [
            { color: 'rgba(255,255,255,0.72)', stroke: 'rgba(255,255,255,0.82)' },
            { color: 'rgba(186,230,253,0.76)', stroke: 'rgba(224,242,254,0.9)' },
            { color: 'rgba(253,224,71,0.78)', stroke: 'rgba(254,240,138,0.9)' },
            { color: 'rgba(249,168,212,0.78)', stroke: 'rgba(251,207,232,0.9)' },
            { color: 'rgba(196,181,253,0.78)', stroke: 'rgba(221,214,254,0.9)' },
            { color: 'rgba(134,239,172,0.78)', stroke: 'rgba(187,247,208,0.9)' }
        ];
        const FONTS = {
            sans: '-apple-system, BlinkMacSystemFont, "SF Pro Display", system-ui, sans-serif',
            rounded: '"SF Pro Rounded", ui-rounded, -apple-system, system-ui, sans-serif',
            serif: 'Georgia, "Times New Roman", serif',
            mono: 'ui-monospace, SFMono-Regular, Menlo, monospace'
        };
        const SHORTCUT_META = {
            torch: { icon: '🔦', app: null },
            camera: { icon: '📷', app: 'aparat' },
            clock: { icon: '⏰', app: 'zegar' },
            calculator: { icon: '🧮', app: 'kalkulator' },
            notes: { icon: '📝', app: 'notatki' }
        };

        const defaultScreens = [
            {
                id: 'ls-1',
                name: 'Ekran 1',
                wallpaperCss: 'radial-gradient(circle at 65% 22%, #38bdf8 0%, #2563eb 38%, #0f172a 78%, #050811 100%)',
                wallpaperImage: '',
                depthEnabled: false,
                foregroundImage: '',
                clockStyle: 'glass',
                clockFont: 'sans',
                clockSize: 108,
                colorIndex: 0,
                shortcuts: { left: 'torch', right: 'camera' },
                widgets: [
                    { id: 'w1', type: 'weather' },
                    { id: 'w2', type: 'battery' }
                ]
            },
            {
                id: 'ls-2',
                name: 'Ekran 2',
                wallpaperCss: 'radial-gradient(circle at 30% 20%, #7c3aed 0%, #312e81 45%, #090d16 90%)',
                wallpaperImage: '',
                depthEnabled: false,
                foregroundImage: '',
                clockStyle: 'glass',
                clockFont: 'rounded',
                clockSize: 118,
                colorIndex: 4,
                shortcuts: { left: 'torch', right: 'camera' },
                widgets: [
                    { id: 'w3', type: 'alarm' },
                    { id: 'w4', type: 'clock' }
                ]
            }
        ];

        function loadStore() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return { activeId: 'ls-1', screens: defaultScreens };
                const parsed = JSON.parse(raw);
                if (!Array.isArray(parsed.screens) || !parsed.screens.length) {
                    return { activeId: 'ls-1', screens: defaultScreens };
                }
                return parsed;
            } catch {
                return { activeId: 'ls-1', screens: defaultScreens };
            }
        }

        let store = loadStore();
        let telemetry = { level: 100, charging: false };
        let notifications = [];
        let torchState = false;
        let editorOpen = false;

        function getActiveScreen() {
            return store.screens.find(s => s.id === store.activeId) || store.screens[0];
        }

        function saveStore(syncParent = true) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); } catch {}
            if (syncParent) {
                const scr = getActiveScreen();
                try {
                    parent.postMessage({
                        type: 'LOCKSCREEN_UPDATED',
                        screen: {
                            id: scr.id,
                            wallpaperCss: scr.wallpaperCss,
                            wallpaperImage: scr.wallpaperImage,
                            widgets: scr.widgets
                        }
                    }, '*');
                } catch {}
            }
        }

        function updateClockAndDate() {
            const now = new Date();
            const days = ['Niedziela', 'Poniedziałek', 'Wtorek', 'Środa', 'Czwartek', 'Piątek', 'Sobota'];
            const months = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca', 'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
            document.getElementById('ls-clock').textContent = now.toTimeString().slice(0, 5);
            document.getElementById('ls-date').textContent = `${days[now.getDay()]}, ${now.getDate()} ${months[now.getMonth()]}`;
        }

        function renderWidgets() {
            const scr = getActiveScreen();
            const underBox = document.getElementById('ls-widgets-under');
            const now = new Date();

            underBox.innerHTML = scr.widgets.map(w => {
                if (w.type === 'weather') {
                    return `<div class="ls-widget" onclick="openApp('zegar')"><div class="w-head">Pogoda</div><div class="w-main">14°</div><div class="w-sub">Częściowe zachmurzenie</div></div>`;
                }
                if (w.type === 'battery') {
                    return `<div class="ls-widget" onclick="openApp('ustawienia')"><div class="w-head">Bateria</div><div class="w-main">${telemetry.level}%</div><div class="w-sub">${telemetry.charging ? 'Ładowanie' : 'Na baterii'}</div></div>`;
                }
                if (w.type === 'calendar') {
                    return `<div class="ls-widget" onclick="openApp('kalendarz')"><div class="w-head">Kalendarz</div><div class="w-main">${now.getDate()} ${now.toLocaleDateString('pl-PL', { month: 'short' })}</div><div class="w-sub">${now.toLocaleDateString('pl-PL', { weekday: 'long' })}</div></div>`;
                }
                if (w.type === 'alarm') {
                    return `<div class="ls-widget" onclick="openApp('zegar')"><div class="w-head">Alarm</div><div class="w-main">06:30</div><div class="w-sub">Dni powszednie</div></div>`;
                }
                return `<div class="ls-widget" onclick="openApp('zegar')"><div class="w-head">Zegar</div><div class="w-main">${now.toTimeString().slice(0, 5)}</div><div class="w-sub">Czas lokalny</div></div>`;
            }).join('');
        }

        function renderNotifications() {
            const box = document.getElementById('ls-notifications');
            const clean = notifications.filter(n => !String(n.title || '').toLowerCase().includes('supervisor'));
            if (!clean.length) {
                box.innerHTML = '';
                return;
            }
            box.innerHTML = clean.slice(0, 3).map(n => `
                <div class="ls-notif-card" onclick="unlockDevice()">
                    <div class="ls-notif-top"><span>${n.app || 'ZenOS'}</span><span>${n.time || 'teraz'}</span></div>
                    <div class="ls-notif-title">${n.title || 'Powiadomienie'}</div>
                    ${n.body ? `<div class="ls-notif-body">${n.body}</div>` : ''}
                </div>
            `).join('');
        }

        function renderScreen() {
            const scr = getActiveScreen();
            const bg = document.getElementById('ls-bg');
            const fg = document.getElementById('ls-fg');
            const clockEl = document.getElementById('ls-clock');
            const col = COLORS[scr.colorIndex % COLORS.length] || COLORS[0];

            bg.style.backgroundImage = scr.wallpaperImage ? `url("${scr.wallpaperImage}")` : (scr.wallpaperCss || defaultScreens[0].wallpaperCss);

            if (scr.depthEnabled && scr.foregroundImage) {
                fg.style.backgroundImage = `url("${scr.foregroundImage}")`;
                fg.classList.add('depth-active');
            } else if (scr.depthEnabled && scr.wallpaperImage) {
                fg.style.backgroundImage = `url("${scr.wallpaperImage}")`;
                fg.classList.add('depth-active');
            } else {
                fg.classList.remove('depth-active');
            }

            clockEl.className = `ls-clock style-${scr.clockStyle || 'glass'}`;
            clockEl.style.setProperty('--ls-clock-size', `${scr.clockSize || 108}px`);
            clockEl.style.setProperty('--ls-clock-font', FONTS[scr.clockFont] || FONTS.sans);
            clockEl.style.setProperty('--ls-clock-color', col.color);
            clockEl.style.setProperty('--ls-clock-stroke', col.stroke);

            const leftMeta = SHORTCUT_META[scr.shortcuts?.left] || SHORTCUT_META.torch;
            const rightMeta = SHORTCUT_META[scr.shortcuts?.right] || SHORTCUT_META.camera;
            const leftBtn = document.getElementById('sc-left');
            const rightBtn = document.getElementById('sc-right');
            leftBtn.textContent = leftMeta.icon;
            rightBtn.textContent = rightMeta.icon;
            leftBtn.classList.toggle('active-torch', scr.shortcuts?.left === 'torch' && torchState);
            rightBtn.classList.toggle('active-torch', scr.shortcuts?.right === 'torch' && torchState);

            document.getElementById('ls-dots').innerHTML = store.screens.map(s => `
                <button class="ls-dot ${s.id === scr.id ? 'active' : ''}" onclick="switchScreen('${s.id}')" aria-label="${s.name}"></button>
            `).join('');

            renderWidgets();
            if (editorOpen) renderEditorControls();
        }

        function switchScreen(id) {
            store.activeId = id;
            saveStore(true);
            renderScreen();
        }

        function createNewScreen() {
            const idx = store.screens.length + 1;
            const palettes = [
                'radial-gradient(circle at 70% 25%, #f97316 0%, #be185d 45%, #1e1b4b 90%)',
                'radial-gradient(circle at 30% 30%, #10b981 0%, #0f766e 48%, #090d16 92%)',
                'radial-gradient(circle at 60% 20%, #60a5fa 0%, #1d4ed8 46%, #060913 90%)'
            ];
            const newScr = {
                ...structuredClone(defaultScreens[0]),
                id: `ls-${Date.now()}`,
                name: `Ekran ${idx}`,
                wallpaperCss: palettes[(idx - 1) % palettes.length],
                wallpaperImage: '',
                foregroundImage: ''
            };
            store.screens.push(newScr);
            store.activeId = newScr.id;
            saveStore(true);
            renderScreen();
        }

        function triggerShortcut(side) {
            const scr = getActiveScreen();
            const key = scr.shortcuts?.[side] || (side === 'left' ? 'torch' : 'camera');
            if (key === 'torch') {
                torchState = !torchState;
                renderScreen();
                try { parent.postMessage({ type: 'TORCH_STATE', active: torchState, intensity: 90 }, '*'); } catch {}
                return;
            }
            const meta = SHORTCUT_META[key];
            if (meta?.app) openApp(meta.app);
        }

        function openApp(appId) {
            try { parent.postMessage({ type: 'OPEN_APP', appId }, '*'); } catch {}
        }

        function unlockDevice() {
            const root = document.getElementById('ls-root');
            root.classList.add('unlocking');
            setTimeout(() => {
                try { parent.postMessage({ type: 'UNLOCK_DEVICE' }, '*'); } catch {}
                root.classList.remove('unlocking');
            }, 220);
        }

        function openEditor() {
            editorOpen = true;
            document.getElementById('ls-editor').classList.add('open');
            renderEditorControls();
        }

        function closeEditor() {
            editorOpen = false;
            document.getElementById('ls-editor').classList.remove('open');
        }

        function renderEditorControls() {
            const scr = getActiveScreen();
            document.getElementById('ed-screens-list').innerHTML = store.screens.map(s => `
                <button class="ed-chip ${s.id === scr.id ? 'active' : ''}" onclick="switchScreen('${s.id}')">${s.name}</button>
            `).join('');

            const depthBtn = document.getElementById('btn-depth');
            depthBtn.textContent = `Depth Effect: ${scr.depthEnabled ? 'WŁ.' : 'WYŁ.'}`;
            depthBtn.classList.toggle('active', Boolean(scr.depthEnabled));
            document.getElementById('fg-upload-wrap').style.display = scr.depthEnabled ? 'inline-flex' : 'none';

            document.querySelectorAll('[data-style]').forEach(b => b.classList.toggle('active', b.dataset.style === scr.clockStyle));
            document.querySelectorAll('[data-font]').forEach(b => b.classList.toggle('active', b.dataset.font === scr.clockFont));
            document.getElementById('ed-size-range').value = scr.clockSize || 108;

            document.getElementById('ed-colors').innerHTML = COLORS.map((c, idx) => `
                <button class="color-dot ${(scr.colorIndex || 0) === idx ? 'active' : ''}" style="background:${c.stroke};" onclick="setClockColor(${idx})"></button>
            `).join('');

            document.getElementById('ed-active-widgets').innerHTML = scr.widgets.map((w, idx) => `
                <div class="widget-chip-manage">
                    <span>${w.type}</span>
                    <button onclick="moveWidget(${idx}, -1)" title="W lewo">‹</button>
                    <button onclick="moveWidget(${idx}, 1)" title="W prawo">›</button>
                    <button onclick="removeWidget(${idx})" title="Usuń">✕</button>
                </div>
            `).join('');

            document.getElementById('sel-sc-left').value = scr.shortcuts?.left || 'torch';
            document.getElementById('sel-sc-right').value = scr.shortcuts?.right || 'camera';
        }

        function handleCustomWallpaper(ev) {
            const file = ev.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                getActiveScreen().wallpaperImage = String(reader.result || '');
                saveStore(true);
                renderScreen();
            };
            reader.readAsDataURL(file);
        }

        function handleDepthForeground(ev) {
            const file = ev.target.files?.[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                getActiveScreen().foregroundImage = String(reader.result || '');
                saveStore(true);
                renderScreen();
            };
            reader.readAsDataURL(file);
        }

        function toggleDepthEffect() {
            const scr = getActiveScreen();
            scr.depthEnabled = !scr.depthEnabled;
            saveStore(true);
            renderScreen();
        }

        function setClockStyle(style) {
            getActiveScreen().clockStyle = style;
            saveStore(false);
            renderScreen();
        }

        function setClockFont(font) {
            getActiveScreen().clockFont = font;
            saveStore(false);
            renderScreen();
        }

        function setClockSize(val) {
            getActiveScreen().clockSize = Number(val);
            saveStore(false);
            renderScreen();
        }

        function setClockColor(idx) {
            getActiveScreen().colorIndex = idx;
            saveStore(false);
            renderScreen();
        }

        function addWidget(type) {
            const scr = getActiveScreen();
            if (scr.widgets.length >= 4) return;
            scr.widgets.push({ id: `w-${Date.now()}-${Math.random().toString(36).slice(2, 5)}`, type });
            saveStore(true);
            renderScreen();
        }

        function removeWidget(idx) {
            getActiveScreen().widgets.splice(idx, 1);
            saveStore(true);
            renderScreen();
        }

        function moveWidget(idx, dir) {
            const scr = getActiveScreen();
            const target = idx + dir;
            if (target < 0 || target >= scr.widgets.length) return;
            const [item] = scr.widgets.splice(idx, 1);
            scr.widgets.splice(target, 0, item);
            saveStore(true);
            renderScreen();
        }

        function setShortcut(side, val) {
            const scr = getActiveScreen();
            scr.shortcuts = scr.shortcuts || { left: 'torch', right: 'camera' };
            scr.shortcuts[side] = val;
            saveStore(false);
            renderScreen();
        }

        let pressTimer = null;
        document.getElementById('ls-root').addEventListener('pointerdown', (e) => {
            if (editorOpen) return;
            if (e.target.closest('button, .ls-widget, .ls-notif-card, .ls-clock')) return;
            pressTimer = setTimeout(() => openEditor(), 520);
        });
        ['pointerup', 'pointercancel', 'pointermove'].forEach(evName => {
            document.getElementById('ls-root').addEventListener(evName, () => clearTimeout(pressTimer));
        });

        let clockDragStartY = null;
        let clockStartSize = 108;
        const clockEl = document.getElementById('ls-clock');
        clockEl.addEventListener('pointerdown', (e) => {
            clockDragStartY = e.clientY;
            clockStartSize = getActiveScreen().clockSize || 108;
            clockEl.setPointerCapture(e.pointerId);
        });
        clockEl.addEventListener('pointermove', (e) => {
            if (clockDragStartY === null) return;
            const delta = clockDragStartY - e.clientY;
            setClockSize(Math.max(68, Math.min(156, Math.round(clockStartSize + delta * 0.45))));
        });
        clockEl.addEventListener('pointerup', () => {
            if (clockDragStartY !== null) {
                clockDragStartY = null;
                saveStore(false);
            }
        });

        let swipeStartY = null;
        document.getElementById('ls-root').addEventListener('pointerdown', (e) => {
            if (editorOpen) return;
            if (e.clientY > window.innerHeight * 0.72) swipeStartY = e.clientY;
        });
        document.getElementById('ls-root').addEventListener('pointerup', (e) => {
            if (swipeStartY === null) return;
            const dy = swipeStartY - e.clientY;
            swipeStartY = null;
            if (dy > 45) unlockDevice();
        });

        window.addEventListener('message', (e) => {
            const data = e.data;
            if (!data || !data.type) return;
            if (data.type === 'TELEMETRY_UPDATED' && data.telemetry) {
                telemetry = { ...telemetry, ...data.telemetry };
                renderWidgets();
            } else if (data.type === 'NOTIFICATIONS_UPDATED' && Array.isArray(data.items)) {
                notifications = data.items;
                renderNotifications();
            } else if (data.type === 'TORCH_SYNC' && typeof data.active === 'boolean') {
                torchState = data.active;
                renderScreen();
            }
        });

        updateClockAndDate();
        renderScreen();
        renderNotifications();
        setInterval(updateClockAndDate, 1000);
    </script>
</body>
</html>
