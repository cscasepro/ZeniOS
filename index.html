<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>ZeniOS Loading</title>
  <style>
    :root {
      --phone-w: 390px;
      --phone-h: 844px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #040508;
      overflow: hidden;
    }

    .viewport-stage {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .scale-box {
      width: var(--phone-w);
      height: var(--phone-h);
      transform-origin: center center;
      flex-shrink: 0;
    }

    .phone-surface {
      position: relative;
      width: var(--phone-w);
      height: var(--phone-h);
      background: #05060a;
      overflow: hidden;
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    .layer.active {
      opacity: 1;
      visibility: visible;
    }

    #loading-still {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      animation: subtleGlow 4.5s ease-in-out infinite;
    }

    @keyframes subtleGlow {
      0%, 100% {
        filter: brightness(0.95) drop-shadow(0 0 0 rgba(255, 255, 255, 0));
      }
      50% {
        filter: brightness(1.06) drop-shadow(0 0 18px rgba(255, 255, 255, 0.22));
      }
    }

    #done-screen {
      background: #05060a;
    }
  </style>
</head>
<body>
  <div class="viewport-stage">
    <div class="scale-box" id="scale-box">
      <div class="phone-surface">
        <section class="layer active" id="still-layer">
          <img id="loading-still" src="Boot_Loading/Zenios_loading.png" alt="Zenios_loading" />
        </section>

        <section class="layer" id="done-screen"></section>
      </div>
    </div>
  </div>

  <script src="loading.js"></script>
</body>
</html>
