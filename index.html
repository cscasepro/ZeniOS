<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZenOS v1.0.2 — Liquid Glass</title>
    <link rel="stylesheet" href="system/theme.css">
    <link id="icon-style-sheet" rel="stylesheet" href="system/icon-styles/liquid.css">
</head>
<body data-icon-style="liquid">
    <div id="wallpaper-layer"></div>
    <div id="brightness-veil"></div>
    <div id="torch-veil"></div>

    <iframe id="boot-screen-frame" src="boot/boot-screen.html" class="boot-overlay"></iframe>

    <div id="os-shell">
        <header id="status-bar" class="priority-top">
            <div class="status-left">
                <span id="clock">15:19</span>
                <span id="focus-badge" style="display:none;" title="Tryb skupienia">🌙</span>
                <span id="battery-badge" style="display:none;" title="Ochrona baterii">🔋</span>
                <span id="flashlight-indicator" style="display:none;" title="Latarka">🔦</span>
            </div>
            <div class="status-right">
                <span id="perf-badge" title="Priorytet i tryb pracy">⚡ TOP-1</span>
                <span id="charging-icon" style="display:none;" title="Ładowanie">⚡</span>
                <span id="battery-pct" title="Bateria">100%</span>
            </div>
        </header>

        <main id="desktop" class="priority-top">
            <div class="pages-viewport" id="pages-viewport">
                <div id="pages-track" class="pages-track">
                    <section class="home-page" data-page="0">
                        <iframe id="widgets-frame" src="modules/widgets.html" class="widgets-box"></iframe>
                        <div id="app-grid-1" class="app-grid"></div>
                    </section>
                    <section class="home-page" data-page="1">
                        <div id="app-grid-2" class="app-grid"></div>
                    </section>
                </div>
            </div>

            <div class="dock-zone">
                <div class="page-dots">
                    <button id="dot-1" class="dot-btn active" onclick="Display.goPage(0)" aria-label="Strona 1"></button>
                    <button id="dot-2" class="dot-btn" onclick="Display.goPage(1)" aria-label="Strona 2"></button>
                </div>

                <button class="search-capsule liquid-glass" onclick="Kernel.toggleSearch()">
                    <span>🔍</span><span>Szukaj</span>
                </button>

                <nav id="iphone-dock" class="dock-capsule liquid-glass"></nav>
            </div>
        </main>

        <div id="app-container"></div>

        <iframe id="search-frame" src="modules/search.html" class="system-overlay hidden"></iframe>
        <iframe id="notifications-frame" src="modules/notifications.html" class="system-overlay hidden"></iframe>
        <iframe id="control-center-frame" src="modules/control-center.html" class="system-overlay hidden"></iframe>
        <iframe id="lockscreen-frame" src="modules/lockscreen.html" class="system-overlay"></iframe>

        <div id="recents-view" class="hidden liquid-glass">
            <h3>Aktywne zakładki w pamięci</h3>
            <div id="recents-list"></div>
            <button class="btn-close-all" onclick="PerformanceManager.purgeBackground()">Wyczyść pamięć tła</button>
        </div>

        <!-- Home Indicator na dole zamiast ciężkiego paska -->
        <div id="home-indicator-zone" class="priority-top">
            <div class="quick-sys-pills">
                <button onclick="Kernel.goHome()" title="Ekran główny">● Pulpit</button>
                <button onclick="Kernel.showRecents()" title="Ostatnie">▢ Pamięć</button>
                <button onclick="Kernel.toggleNotifications()" title="Powiadomienia">🔔</button>
                <button onclick="Kernel.toggleControlCenter()" title="Centrum sterowania">☰</button>
                <button onclick="Kernel.lockDevice()" title="Zablokuj">🔒</button>
            </div>
            <button id="home-indicator" onclick="Kernel.goHome()" aria-label="Home Indicator"></button>
        </div>
    </div>

    <script src="boot/bootloader.js"></script>
    <script src="system/manifest.js"></script>
    <script src="system/storage.js"></script>
    <script src="system/device-telemetry.js"></script>
    <script src="system/battery-saver.js"></script>
    <script src="system/performance.js"></script>
    <script src="system/watchdog.js"></script>
    <script src="system/supervisor.js"></script>
    <script src="system/notifications.js"></script>
    <script src="system/focus-mode.js"></script>
    <script src="system/icon-theme.js"></script>
    <script src="system/wallpapers.js"></script>
    <script src="system/display.js"></script>
    <script src="system/widgets.js"></script>
    <script src="system/search.js"></script>
    <script src="system/kernel.js"></script>
</body>
</html>
